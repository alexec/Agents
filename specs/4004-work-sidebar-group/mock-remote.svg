      <g font-size="14" fill="#1C1D20">
        <rect x="14" y="162" width="222" height="76" rx="10" fill="#fff"/>
        <circle cx="30" cy="180" r="5" fill="none" stroke="#1F883D" stroke-width="1.6"/><circle cx="30" cy="180" r="1.6" fill="#1F883D"/>
        <text x="44" y="184">Sidebar: a folding Work</text>
        <text x="44" y="202">group with a row per list</text>
