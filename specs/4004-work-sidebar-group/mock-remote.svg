        <rect x="14" y="246" width="222" height="76" rx="10" fill="#fff"/>
        <circle cx="30" cy="264" r="5" fill="none" stroke="#1F883D" stroke-width="1.6"/><circle cx="30" cy="264" r="1.6" fill="#1F883D"/>
