        <text x="246" y="118">Sidebar: a folding Work group</text>
        <text x="246" y="136" font-size="11" fill="#8A9099">#4004 · 2 sessions · $0.41</text>
        <rect x="216" y="154" width="352" height="50" rx="8" fill="#fff" stroke="#ECEEF1"/>
        <circle cx="232" cy="172" r="5" fill="none" stroke="#1F883D" stroke-width="1.6"/><circle cx="232" cy="172" r="1.6" fill="#1F883D"/>
        <text x="246" y="176">Machines in the sidebar, part 2</text>
        <text x="246" y="194" font-size="11" fill="#8A9099">#3979 · No agent yet</text>
