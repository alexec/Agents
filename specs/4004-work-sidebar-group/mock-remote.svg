  <rect width="1200" height="700" fill="#E7EAEE"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1C1D20">Remote · the Work group on the iPhone and the iPad, and the web as it is</text>
  <text x="24" y="54" font-size="12" fill="#6B7280">Hi-fi mock for #4004 · Paper palette, light · no Features row on the Remote (tier mac+web, #3269)</text>

