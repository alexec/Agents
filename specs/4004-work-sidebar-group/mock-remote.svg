  <!-- callouts under the phones -->
  <g font-size="11.5" fill="#3F444B" transform="translate(24,640)">
    <text x="0" y="0">A row pushes its list; the bar's title is the list's. The kind menu in the bar is gone.</text>
    <text x="0" y="16" fill="#6B7280">‹ › stay at the bar's end, for Back and Forward along the places, as now.</text>
  </g>

