      <rect x="92" y="18" width="66" height="20" rx="10" fill="#1C1D20"/>
      <text x="20" y="84" font-size="26" font-weight="700" fill="#1C1D20">Agents</text>

      <rect x="14" y="100" width="222" height="40" rx="10" fill="#fff"/>
