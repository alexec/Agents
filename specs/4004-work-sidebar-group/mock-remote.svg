        <rect x="304" y="62" width="76" height="22" rx="6" fill="#EEF0F3"/><text x="312" y="77">Label: Any</text>
        <rect x="386" y="62" width="182" height="22" rx="6" fill="#fff" stroke="#DADDE2"/><text x="396" y="77" fill="#9AA1AB">Search issues</text>
