        <rect x="134" y="8" width="48" height="22" rx="6" fill="#D8DEE6"/><text x="144" y="23" fill="#1C1D20" font-weight="600">Work</text>
        <text x="194" y="23">Docs</text><text x="236" y="23">Machines</text><text x="302" y="23">Workflows</text><text x="372" y="23">Reports</text>
