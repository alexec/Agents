    <g transform="translate(0,14)" filter="url(#shadow)"><rect width="250" height="520" rx="34" fill="#F2F3F5"/></g>
    <g transform="translate(0,14)">
      <text x="28" y="34" font-size="12" font-weight="600" fill="#1C1D20">9:41</text>
      <rect x="92" y="18" width="66" height="20" rx="10" fill="#1C1D20"/>
      <use href="#chev-left" x="14" y="58" width="14" height="14" color="#0A84FF"/>
      <text x="30" y="70" font-size="15" fill="#0A84FF">Agents</text>
      <text x="125" y="70" font-size="15" font-weight="600" fill="#1C1D20" text-anchor="middle">Issues</text>
      <text x="196" y="70" font-size="15" fill="#B5BAC2">‹</text>
