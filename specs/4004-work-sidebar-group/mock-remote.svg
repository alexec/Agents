        <path d="M52 214h184" stroke="#ECEEF1"/>
        <use href="#pr" x="26" y="226" width="16" height="16" color="#0A84FF"/><text x="52" y="239">Pull requests</text>
        <use href="#chev-right" x="216" y="229" width="10" height="10" color="#B5BAC2"/>
        <path d="M52 254h184" stroke="#ECEEF1"/>
        <use href="#flag" x="26" y="266" width="16" height="16" color="#0A84FF"/><text x="52" y="279">Milestones</text>
        <use href="#chev-right" x="216" y="269" width="10" height="10" color="#B5BAC2"/>
        <path d="M52 294h184" stroke="#ECEEF1"/>
        <use href="#box" x="26" y="306" width="16" height="16" color="#0A84FF"/><text x="52" y="319">Releases</text>
        <use href="#chev-right" x="216" y="309" width="10" height="10" color="#B5BAC2"/>
      </g>

      <g opacity=".45">
