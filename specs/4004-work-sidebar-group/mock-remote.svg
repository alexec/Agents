      <use href="#box" x="18" y="174" width="16" height="16" color="#0A84FF"/><text x="42" y="187" font-size="13" fill="#1C1D20">Releases</text>
      <g opacity=".45">
        <use href="#chev-down" x="14" y="211" width="10" height="10" color="#8A9099"/>
        <text x="30" y="220" font-size="11" font-weight="600" fill="#8A9099">Status</text>
        <use href="#list" x="18" y="230" width="16" height="16" color="#0A84FF"/><text x="42" y="243" font-size="13" fill="#1C1D20">Events</text>
        <use href="#cpu" x="18" y="258" width="16" height="16" color="#0A84FF"/><text x="42" y="271" font-size="13" fill="#1C1D20">Runtimes</text>
