<text x="780.0" y="454.0" font-size="12" fill="#5B616B" >Signed in as Open in Browser does: on this Mac's control plane</text>
<text x="780.0" y="470.0" font-size="12" fill="#5B616B" >it pairs the browser the first time; elsewhere, the page's own</text>
<text x="780.0" y="486.0" font-size="12" fill="#5B616B" >sign-in keeps the address. The link carries no code or token.</text>
