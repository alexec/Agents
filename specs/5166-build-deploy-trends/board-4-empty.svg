<text x="639.0" y="194.0" font-size="12" fill="#5B616B" >alexec/agents-walk has no GitHub</text>
<text x="639.0" y="210.0" font-size="12" fill="#5B616B" >Actions runs. Builds</text>
<text x="639.0" y="226.0" font-size="12" fill="#5B616B" >come from the forge's CI runs.</text>
<circle cx="902.5" cy="102.0" r="9" fill="#B35900"/>
<text x="902.5" y="106.0" font-size="11" fill="#FFF" font-weight="700" text-anchor="middle">3</text>
<rect x="928.5" y="90.0" width="287.5" height="210.0" rx="8" fill="#FFFFFF" stroke="#C7CCD3" stroke-width="1"/>
<text x="940.5" y="112.0" font-size="11" fill="#5B616B" font-weight="600">A forge Agents does not read CI from</text>
<text x="940.5" y="140.0" font-size="10" fill="#5B616B" font-weight="600">TIME TO GREEN · MEDIAN</text>
<text x="940.5" y="166.0" font-size="22" fill="#1C1D20" font-weight="600">–</text>
<text x="940.5" y="194.0" font-size="12" fill="#5B616B" >Forgejo: Agents does not read</text>
<text x="940.5" y="210.0" font-size="12" fill="#5B616B" >its CI runs yet, so there is</text>
<text x="940.5" y="226.0" font-size="12" fill="#5B616B" >nothing to draw for</text>
<text x="940.5" y="242.0" font-size="12" fill="#5B616B" >codeberg.org/scratch/app.</text>
