<text x="24.0" y="34.0" font-size="15" fill="#1C1D20" font-weight="600">4 · Empty states, a forge with no CI data, and the way in from Planning</text>
<text x="24.0" y="54.0" font-size="12" fill="#5B616B" >The repositories on these cards are scratch. The Delivery row's first card is today's (#4555); the link under it is new.</text>
