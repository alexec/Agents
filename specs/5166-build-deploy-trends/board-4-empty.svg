<text x="232.0" y="438.0" font-size="18" fill="#1C1D20" font-weight="600">5.1 a week</text>
<rect x="404.0" y="394.0" width="170.0" height="76.0" rx="6" fill="#FFFFFF" stroke="#DDE1E6" stroke-width="1"/>
