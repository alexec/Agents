<circle cx="202.0" cy="456.0" r="9" fill="#B35900"/>
<text x="202.0" y="460.0" font-size="11" fill="#FFF" font-weight="700" text-anchor="middle">5</text>
<text x="40.0" y="492.0" font-size="11" fill="#5B616B" >The link names the repository and the range: #/reports/value/builds?repo=github:alexec/agents&amp;range=month.</text>
<text x="820.0" y="380.0" font-size="12" fill="#5B616B" >With no CI data in any repository of the scope,</text>
<text x="820.0" y="396.0" font-size="12" fill="#5B616B" >the card says so and the link still opens the page</text>
<text x="820.0" y="412.0" font-size="12" fill="#5B616B" >(card 3 says why there is nothing).</text>
<text x="24.0" y="540.0" font-size="12" fill="#5B616B" font-weight="600">Loading is the Reports pages' own Loading…; an error is their hint line. No toast, no modal.</text>
