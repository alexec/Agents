  <text x="24" y="694" font-size="11.5" fill="#5B616B">1  The column head: Back to the folder, the title, the folder's name quiet after it. The address is /ar/sessions (and /ar/workflows).</text>
  <text x="24" y="710" font-size="11.5" fill="#5B616B">2  A filter field under the head, 260 px wide; on a narrow page it fills the width. It filters what is loaded and asks the host with the words, as the sidebar search does.</text>
  <text x="24" y="726" font-size="11.5" fill="#5B616B">3  The footer: the count and a Load more button (a button, so a keyboard reaches it).</text>
  <text x="24" y="742" font-size="11.5" fill="#5B616B">4  Two sidebar rows, as the Mac's. The open page's row is marked chosen.</text>
  <text x="24" y="758" font-size="11.5" fill="#5B616B">5  At 390 px: no labels on the row, the title cut at one line, the footer centred.</text>
</svg>
