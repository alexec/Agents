<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="600" viewBox="0 0 1340 600" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#20242A" flood-opacity="0.14"/>
    </filter>
    <symbol id="box" viewBox="0 0 16 16"><path d="M2.5 3.5h11v3h-11zM3.5 6.5v6h9v-6M6.5 9h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chevr" viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="back" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="fwd" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="tick" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="pause" viewBox="0 0 16 16"><path d="M5.5 4v8M10.5 4v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="rack" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="9" width="11" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="flow" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="warn" viewBox="0 0 16 16"><path d="M8 2.2L14.3 13.5H1.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="currentColor"/></symbol>
    <symbol id="spin" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="cross" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="hand" viewBox="0 0 16 16"><path d="M5 8V3.5a1 1 0 0 1 2 0V7M7 7V2.5a1 1 0 0 1 2 0V7M9 7V3.5a1 1 0 0 1 2 0V8.5M11 8.5V5a1 1 0 0 1 2 0v4.5c0 3-2 4.5-4.5 4.5S4.5 12.5 4 10L3 7.5a1 1 0 0 1 1.9-.6L5 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="sparkles" viewBox="0 0 16 16"><path d="M6.5 2.5l1.2 3.3 3.3 1.2-3.3 1.2-1.2 3.3-1.2-3.3L2 7l3.3-1.2zM12 9.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></symbol>
    <symbol id="doc" viewBox="0 0 16 16"><path d="M4 1.8h5.2L12.5 5v9.2H4zM9 1.8V5.2h3.5M6 8h4.5M6 10.5h4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
  </defs>
  <rect x="0" y="0" width="1340" height="600" rx="0" fill="#E7EAEE"/>
  <text x="24" y="34" font-size="15" fill="#1C1D20" font-weight="600">Archived Sessions and Archived Workflows (#4448): the states</text>
  <text x="24" y="54" font-size="12" fill="#5B616B">Tiles of the Mac page's content column; the Remote and the web draw the same words. Scratch data.</text>
  <text x="24" y="72" font-size="12.5" fill="#1C1D20" font-weight="600">1  Loading, first read</text>
  <g transform="translate(24,80)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <rect x="20" y="16" width="60" height="10" rx="5" fill="#E6E8EB"/>
  <circle cx="27" cy="49" r="7" fill="#E6E8EB"/>
  <rect x="42" y="43" width="162.0" height="10" rx="5" fill="#E6E8EB"/>
  <rect x="42" y="61" width="251.99999999999997" height="8" rx="4" fill="#EEF0F2"/>
  <path d="M42 78L380 78" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  <circle cx="27" cy="95" r="7" fill="#E6E8EB"/>
  <rect x="42" y="89" width="162.0" height="10" rx="5" fill="#E6E8EB"/>
  <rect x="42" y="107" width="251.99999999999997" height="8" rx="4" fill="#EEF0F2"/>
  <path d="M42 124L380 124" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  <circle cx="27" cy="141" r="7" fill="#E6E8EB"/>
  <rect x="42" y="135" width="162.0" height="10" rx="5" fill="#E6E8EB"/>
  <rect x="42" y="153" width="251.99999999999997" height="8" rx="4" fill="#EEF0F2"/>
  <path d="M42 170L380 170" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  </g>
  <text x="460" y="72" font-size="12.5" fill="#1C1D20" font-weight="600">2  Empty</text>
  <g transform="translate(460,80)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <use href="#box" x="184.0" y="56" width="32" height="32" color="#C7CCD3"/>
  <text x="200.0" y="116" font-size="14" fill="#1C1D20" font-weight="600" text-anchor="middle">No Archived Sessions</text>
  <text x="200.0" y="138" font-size="12" fill="#5B616B" text-anchor="middle">Sessions you archive in Agents show here.</text>
  </g>
  <text x="896" y="72" font-size="12.5" fill="#1C1D20" font-weight="600">3  Its machine is not answering</text>
  <g transform="translate(896,80)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <rect x="20" y="16" width="360" height="32" rx="7" fill="#FFF4E5"/>
  <use href="#warn" x="30" y="24" width="16" height="16" color="#B35900"/>
  <text x="54" y="37" font-size="12" fill="#7A4A00">Its machine isn’t answering. Showing what was last read.</text>
  <g transform="translate(0,0)" opacity="0.55">
  <use href="#box" x="20" y="66" width="14" height="14" color="#8A9099"/>
  <text x="42" y="77" font-size="13" fill="#1C1D20">Sidebar: a folding Work group</text>
  <text x="380" y="77" font-size="11.5" fill="#8A9099" text-anchor="end">2 h ago</text>
  <text x="42" y="93" font-size="11.5" fill="#5B616B">Merged P#4021 · the segmented picker is gone</text>
  <path d="M42 102L380 102" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(0,0)" opacity="0.55">
  <use href="#box" x="20" y="112" width="14" height="14" color="#8A9099"/>
  <text x="42" y="123" font-size="13" fill="#1C1D20">Fix the web test job</text>
  <text x="380" y="123" font-size="11.5" fill="#8A9099" text-anchor="end">5 h ago</text>
  <text x="42" y="139" font-size="11.5" fill="#5B616B">A failing web test fails the web job now</text>
  <path d="M42 148L380 148" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(0,0)" opacity="0.55">
  <use href="#box" x="20" y="158" width="14" height="14" color="#8A9099"/>
  <text x="42" y="169" font-size="13" fill="#1C1D20">Messages page, read only</text>
  <text x="380" y="169" font-size="11.5" fill="#8A9099" text-anchor="end">9 h ago</text>
  <text x="42" y="185" font-size="11.5" fill="#5B616B">Shipped on the Mac and the web; the Remote is tier mac+web</text>
  <path d="M42 194L380 194" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  </g>
  </g>
  <text x="24" y="322" font-size="12.5" fill="#1C1D20" font-weight="600">4  Filter with no match</text>
  <g transform="translate(24,330)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <rect x="20" y="16" width="360" height="28" rx="7" fill="#FFFFFF" stroke="#C7CCD3" stroke-width="1"/>
  <use href="#search" x="28" y="23.0" width="14" height="14" color="#8A9099"/>
  <text x="48" y="34.5" font-size="12.5" fill="#8A9099">walk simulator</text>
  <text x="200.0" y="110" font-size="14" fill="#1C1D20" font-weight="600" text-anchor="middle">No archived sessions match</text>
  <rect x="170.0" y="128" width="56.5" height="26" rx="7" fill="#FFFFFF" stroke="#C7CCD3" stroke-width="1"/>
  <text x="182.0" y="145.5" font-size="12.5" fill="#1C1D20" font-weight="500">Clear</text>
  </g>
  <text x="460" y="322" font-size="12.5" fill="#1C1D20" font-weight="600">5  Loading more</text>
  <g transform="translate(460,330)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <use href="#box" x="20" y="18" width="14" height="14" color="#8A9099"/>
  <text x="42" y="29" font-size="13" fill="#1C1D20">Why does the walk hang on the simulator?</text>
  <text x="380" y="29" font-size="11.5" fill="#8A9099" text-anchor="end">16:12</text>
  <text x="42" y="45" font-size="11.5" fill="#5B616B">The sim had a stale lock; filed #4402</text>
  <path d="M42 54L380 54" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  <use href="#box" x="20" y="64" width="14" height="14" color="#8A9099"/>
  <text x="42" y="75" font-size="13" fill="#1C1D20">Lint: shellcheck on scripts/web.sh</text>
  <text x="380" y="75" font-size="11.5" fill="#8A9099" text-anchor="end">09:48</text>
  <text x="42" y="91" font-size="11.5" fill="#5B616B">Two warnings fixed</text>
  <path d="M42 100L380 100" stroke="#E0E3E7" stroke-width="1" fill="none"/>
  <use href="#spin" x="20" y="120" width="14" height="14" color="#8A9099"/>
  <text x="42" y="132" font-size="12" fill="#5B616B">Loading more…</text>
  <text x="20" y="160" font-size="11.5" fill="#5B616B">100 of 128 archived sessions</text>
  </g>
  <text x="896" y="322" font-size="12.5" fill="#1C1D20" font-weight="600">6  Archived Workflows, empty</text>
  <g transform="translate(896,330)" filter="url(#shadow)">
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#FFFFFF"/>
  <use href="#flow" x="184.0" y="56" width="32" height="32" color="#C7CCD3"/>
  <text x="200.0" y="116" font-size="14" fill="#1C1D20" font-weight="600" text-anchor="middle">No Archived Workflows</text>
  <text x="200.0" y="138" font-size="12" fill="#5B616B" text-anchor="middle">Workflows you archive in Agents show here.</text>
  </g>
  <text x="24" y="548" font-size="11.5" fill="#5B616B">1  Placeholder rows that shimmer while the host answers; never “none” before it has said (#664).</text>
  <text x="684" y="548" font-size="11.5" fill="#5B616B">2  Centred glyph, title and one line. Seen after the last one is unarchived or by a link: the sidebar row hides at zero.</text>
  <text x="24" y="564" font-size="11.5" fill="#5B616B">3  A strip over the rows last read, dimmed; with none read, the strip stands alone in the middle.</text>
  <text x="684" y="564" font-size="11.5" fill="#5B616B">4  The filter's words stay in the field; Clear empties it.</text>
  <text x="24" y="580" font-size="11.5" fill="#5B616B">5  Load more becomes a spinner and the words; the count under it updates when the page lands.</text>
  <text x="684" y="580" font-size="11.5" fill="#5B616B">6  The same shape on the workflows page.</text>
</svg>
