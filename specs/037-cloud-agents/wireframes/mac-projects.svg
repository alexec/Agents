<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; } .s { fill:#6e6e73; } .q { fill:#aeaeb2; }
    .title { font-size:22px; font-weight:600; }
    .h { font-size:13px; font-weight:600; fill:#6e6e73; letter-spacing:.3px; }
    .r { font-size:14px; } .rb { font-size:14px; font-weight:600; } .f { font-size:12px; }
    .btn { fill:#fff; stroke:#c7c7cc; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
  </style>

  <rect x="0.5" y="0.5" width="1119" height="699" rx="12" fill="#fff" stroke="#c7c7cc"/>
  <rect x="0.5" y="0.5" width="1119" height="40" rx="12" fill="#f5f5f7"/>
  <circle cx="22" cy="20" r="6" fill="#d1d1d6"/><circle cx="42" cy="20" r="6" fill="#d1d1d6"/><circle cx="62" cy="20" r="6" fill="#d1d1d6"/>

  <!-- sidebar -->
  <rect x="0.5" y="40" width="250" height="659" fill="#f5f5f7" stroke="#e5e5ea"/>
  <text x="20" y="72" class="h">PROJECTS</text>
  <rect x="200" y="58" width="36" height="22" rx="5" class="btn"/><text x="218" y="74" class="r t" text-anchor="middle">+</text>

  <text x="20" y="106" class="h">THIS MAC</text>
  <text x="24" y="132" class="r t">Agents</text><text x="220" y="132" class="f s" text-anchor="end">4</text>
  <text x="24" y="160" class="r t">Paper site</text><text x="220" y="160" class="f s" text-anchor="end">1</text>

  <text x="20" y="198" class="h">DEVBOX</text>
  <circle cx="86" cy="194" r="4" fill="#34c759"/>
  <rect x="12" y="208" width="226" height="30" rx="6" fill="#dcdce1"/>
  <text x="24" y="228" class="rb t">ml-pipeline</text><text x="220" y="228" class="f s" text-anchor="end">3</text>
  <text x="24" y="258" class="r t">infra</text><text x="220" y="258" class="f s" text-anchor="end">—</text>

  <text x="20" y="296" class="h">GPU-01</text>
  <circle cx="80" cy="292" r="4" fill="#aeaeb2"/><text x="92" y="296" class="f s">Offline · 14:02</text>
  <text x="24" y="322" class="r q">training</text><text x="220" y="322" class="f q" text-anchor="end">1</text>

  <text x="20" y="360" class="h">STAGING</text>
  <circle cx="86" cy="356" r="4" fill="#c77700"/><text x="98" y="360" class="f s">Update waiting</text>
  <text x="24" y="386" class="r t">api</text><text x="220" y="386" class="f s" text-anchor="end">2</text>

  <line x1="12" y1="600" x2="238" y2="600" stroke="#e5e5ea"/>
  <text x="24" y="630" class="r t">Spending</text>
  <text x="24" y="648" class="f s">£6.10 today · £1.90 on servers</text>

  <text x="262" y="106" class="note">← host headings appear only once a server</text>
  <text x="262" y="122" class="note">   is added; one host = today's flat list</text>
  <text x="262" y="198" class="note">← green dot: connected, no word</text>
  <text x="262" y="296" class="note">← offline: grey dot, time, rows dimmed</text>
  <text x="262" y="360" class="note">← new version waiting for a turn to end</text>

  <!-- detail -->
  <text x="560" y="84" class="title t">ml-pipeline</text>
  <text x="560" y="104" class="f s">on devbox · ~/src/ml-pipeline</text>
  <rect x="980" y="66" width="110" height="28" rx="6" class="btn"/><text x="1035" y="85" class="f t" text-anchor="middle">New agent</text>

  <rect x="560" y="130" width="530" height="64" rx="10" fill="#fff" stroke="#e5e5ea"/>
  <circle cx="580" cy="152" r="5" fill="#0a84ff"/>
  <text x="594" y="157" class="rb t">Tune the tokenizer</text><text x="1074" y="157" class="f s" text-anchor="end">Working · 12 min</text>
  <text x="594" y="178" class="f s">Running pytest tests/tokenizer -x</text>

  <rect x="560" y="206" width="530" height="64" rx="10" fill="#fff" stroke="#e5e5ea"/>
  <circle cx="580" cy="228" r="5" fill="#c77700"/>
  <text x="594" y="233" class="rb t">Port loader to Arrow</text><text x="1074" y="233" class="f s" text-anchor="end">Needs you</text>
  <text x="594" y="254" class="f s">Wants to run: pip install pyarrow==17</text>

  <rect x="560" y="282" width="530" height="64" rx="10" fill="#fff" stroke="#e5e5ea"/>
  <circle cx="580" cy="304" r="5" fill="#34c759"/>
  <text x="594" y="309" class="rb t">Fix flaky eval</text><text x="1074" y="309" class="f s" text-anchor="end">Done · 2 h ago</text>
  <text x="594" y="330" class="f s">Seeded the shuffle; 20/20 green.</text>

  <text x="560" y="380" class="note">The agent list, chat, files and terminal are today's screens. The only visible</text>
  <text x="560" y="396" class="note">change is “on devbox” under the project name. No Show in Finder, no Keep awake.</text>
</svg>
