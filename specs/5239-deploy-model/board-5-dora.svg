<text x="24.0" y="54.0" font-size="12" fill="#5B616B" font-variant-numeric="tabular-nums">Real: this repo's deployments. The Mac app and the App Store over 30 days, the docs over 7 (the API's last 100 github-pages deploys reach that far).</text>
<text x="24.0" y="70.0" font-size="12" fill="#5B616B" font-variant-numeric="tabular-nums">Lead time: a PR's merge to the first deploy that brings it. Change failure rate: failed deploys and rollbacks, of all deploys. Time to restore: a failure to the next deploy that went out.</text>
