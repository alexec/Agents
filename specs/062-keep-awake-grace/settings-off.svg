<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .ink { fill:#1F1D1A; }
    .sec { fill:#6F6A62; }
    .onpaper { fill:#FBF9F4; }
    .dim { fill:#1F1D1A; opacity:.38; }
    .h { font-size:11px; font-weight:600; letter-spacing:.4px; fill:#6F6A62; }
    .title { font-size:22px; font-weight:600; fill:#1F1D1A; }
    .r { font-size:14px; fill:#1F1D1A; }
    .rb { font-size:14px; font-weight:600; fill:#1F1D1A; }
    .f { font-size:12px; fill:#6F6A62; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
  </style>

  <rect x="0.5" y="0.5" width="859" height="559" rx="12" fill="#FBF9F4" stroke="#E2DCCF"/>
  <rect x="0.5" y="0.5" width="859" height="40" rx="12" fill="#F3F0E8"/>
  <rect x="0.5" y="28" width="859" height="13" fill="#F3F0E8"/>
  <circle cx="22" cy="20" r="6" fill="#E2DCCF"/>
  <circle cx="42" cy="20" r="6" fill="#E2DCCF"/>
  <circle cx="62" cy="20" r="6" fill="#E2DCCF"/>
  <text x="430" y="25" text-anchor="middle" class="rb">General</text>

  <rect x="0.5" y="40" width="200" height="519" fill="#F3F0E8"/>
  <line x1="200" y1="40" x2="200" y2="559" stroke="#E2DCCF"/>

  <rect x="10" y="56" width="180" height="32" rx="7" fill="#1F1D1A"/>
  <text x="38" y="77" class="r onpaper">General</text>
  <text x="38" y="116" class="r ink">Agents</text>
  <text x="22" y="150" class="h">AGENT RUNTIMES</text>
  <text x="38" y="184" class="r ink">Spending</text>
  <text x="38" y="216" class="r ink">Pool</text>
  <text x="22" y="256" class="h">SHARED</text>
  <text x="38" y="294" class="r ink">Devices</text>
  <text x="38" y="326" class="r ink">Servers</text>

  <text x="232" y="84" class="title">General</text>

  <text x="232" y="124" class="h">APPEARANCE</text>
  <rect x="232" y="136" width="420" height="32" rx="7" fill="#FFFFFF" stroke="#E2DCCF"/>
  <rect x="234" y="138" width="138" height="28" rx="6" fill="#ECE7DB"/>
  <text x="303" y="157" text-anchor="middle" class="rb">System</text>
  <text x="442" y="157" text-anchor="middle" class="r sec">Light</text>
  <text x="582" y="157" text-anchor="middle" class="r sec">Dark</text>
  <text x="232" y="188" class="f">System follows your Mac, and changes with it.</text>

  <text x="232" y="232" class="h">SLEEP</text>
  <text x="232" y="268" class="r ink">Keep this Mac awake while agents are working</text>
  <rect x="612" y="250" width="44" height="26" rx="13" fill="#E2DCCF"/>
  <circle cx="625" cy="263" r="10" fill="#FFFFFF"/>

  <text x="232" y="316" class="dim" font-size="14">After they stop</text>
  <rect x="500" y="296" width="156" height="30" rx="7" fill="#FFFFFF" stroke="#E2DCCF" opacity="0.45"/>
  <text x="514" y="316" class="dim" font-size="14">1 hour</text>
  <text x="636" y="316" class="dim" font-size="14">▾</text>

  <text x="232" y="360" class="f">The Mac sleeps on its own schedule, including while an agent is working.</text>
  <text x="232" y="378" class="f">The time above is kept for when you turn this back on.</text>

  <text x="16" y="600" class="note">Off: nothing is held, even with an agent mid-turn. The sidebar stays quiet.</text>
  <text x="16" y="620" class="note">The time you chose stays put, and the menu cannot be opened.</text>
</svg>
