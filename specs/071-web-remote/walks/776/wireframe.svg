<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; } .s { fill:#6e6e73; } .q { fill:#aeaeb2; }
    .title { font-size:20px; font-weight:600; }
    .h { font-size:13px; font-weight:600; fill:#6e6e73; letter-spacing:.3px; }
    .r { font-size:14px; } .rb { font-size:14px; font-weight:600; } .f { font-size:12px; }
    .well { fill:#eef0f4; stroke:#d9dce3; }
    .ground { fill:#fafbfc; }
    .track { fill:#dcdfe6; } .bar { fill:#2f6fde; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
    .code { font-family: 'SF Mono', Menlo, monospace; font-size:13px; }
  </style>

  <text x="20" y="34" class="title t">Plan strip: card + progress bar (#341 follow-up)</text>
  <text x="20" y="56" class="f s">Mac window, Remote (iPhone/iPad) and web draw the same strip. No state colour: the bar is the accent.</text>

  <!-- ===== BEFORE ===== -->
  <text x="20" y="96" class="h">NOW</text>
  <rect x="20.5" y="106" width="580" height="200" rx="10" class="ground" stroke="#c7c7cc"/>
  <text x="44" y="138" class="q f">▸</text>
  <text x="60" y="138" class="f s">Fix the sidebar row — 2 of 5 done</text>
  <line x1="20" y1="154" x2="600" y2="154" stroke="#eceef2"/>
  <text x="44" y="186" class="f s">Claude · 13:49</text>
  <text x="44" y="208" class="r t">Reading AgentRow.swift to see where the</text>
  <text x="44" y="228" class="r t">second line is chosen…</text>
  <text x="44" y="272" class="note">Grey on the page's own paper: reads as part</text>
  <text x="44" y="288" class="note">of the transcript, easy to miss.</text>

  <!-- ===== AFTER, COLLAPSED ===== -->
  <text x="640" y="96" class="h">PROPOSED · COLLAPSED</text>
  <rect x="640.5" y="106" width="580" height="200" rx="10" class="ground" stroke="#c7c7cc"/>
  <rect x="656" y="118" width="548" height="54" rx="10" class="well"/>
  <!-- checklist icon -->
  <rect x="672" y="130" width="16" height="16" rx="3" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M675.5 138 l3 3 l6 -7" fill="none" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="698" y="143" class="r t">Fix the sidebar row</text>
  <text x="1140" y="143" class="f s" text-anchor="end">2 of 5</text>
  <text x="1188" y="143" class="f s" text-anchor="end">▸</text>
  <rect x="672" y="156" width="516" height="4" rx="2" class="track"/>
  <rect x="672" y="156" width="206" height="4" rx="2" class="bar"/>
  <text x="672" y="200" class="f s">Claude · 13:49</text>
  <text x="672" y="222" class="r t">Reading AgentRow.swift to see where the</text>
  <text x="672" y="242" class="r t">second line is chosen…</text>
  <text x="672" y="276" class="note">A raised card on the well, like the offline strip.</text>
  <text x="672" y="292" class="note">Step in primary text; count and chevron in grey.</text>

  <!-- ===== AFTER, EXPANDED ===== -->
  <text x="20" y="346" class="h">PROPOSED · OPENED (click the card)</text>
  <rect x="20.5" y="356" width="580" height="300" rx="10" class="ground" stroke="#c7c7cc"/>
  <rect x="36" y="368" width="548" height="236" rx="10" class="well"/>
  <rect x="52" y="380" width="16" height="16" rx="3" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M55.5 388 l3 3 l6 -7" fill="none" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="78" y="393" class="r t">Fix the sidebar row</text>
  <text x="520" y="393" class="f s" text-anchor="end">2 of 5</text>
  <text x="568" y="393" class="f s" text-anchor="end">▾</text>
  <rect x="52" y="406" width="516" height="4" rx="2" class="track"/>
  <rect x="52" y="406" width="206" height="4" rx="2" class="bar"/>
  <line x1="52" y1="424" x2="568" y2="424" stroke="#d9dce3"/>
  <text x="56" y="450" class="code s">✓</text><text x="78" y="450" class="r s">Find where the row's second line is chosen</text>
  <text x="56" y="478" class="code s">✓</text><text x="78" y="478" class="r s">Write a failing test for the stale line</text>
  <text x="56" y="506" class="code t">▸</text><text x="78" y="506" class="rb t">Fix the sidebar row</text>
  <text x="56" y="534" class="code q">○</text><text x="78" y="534" class="r t">Do the same on the Remote and web</text>
  <text x="56" y="562" class="code q">○</text><text x="78" y="562" class="r t">Update parity.md</text>
  <text x="52" y="632" class="note">The checklist is today's PlanView, inside the card;</text>
  <text x="52" y="648" class="note">the step in progress is drawn semibold.</text>

  <!-- ===== DONE / NOTHING IN PROGRESS ===== -->
  <text x="640" y="346" class="h">PROPOSED · BETWEEN STEPS, AND ALL DONE</text>
  <rect x="640.5" y="356" width="580" height="160" rx="10" class="ground" stroke="#c7c7cc"/>
  <rect x="656" y="368" width="548" height="54" rx="10" class="well"/>
  <rect x="672" y="380" width="16" height="16" rx="3" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M675.5 388 l3 3 l6 -7" fill="none" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="698" y="393" class="r t">Plan</text>
  <text x="1140" y="393" class="f s" text-anchor="end">3 of 5</text>
  <text x="1188" y="393" class="f s" text-anchor="end">▸</text>
  <rect x="672" y="406" width="516" height="4" rx="2" class="track"/>
  <rect x="672" y="406" width="310" height="4" rx="2" class="bar"/>
  <rect x="656" y="436" width="548" height="54" rx="10" class="well"/>
  <rect x="672" y="448" width="16" height="16" rx="3" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M675.5 456 l3 3 l6 -7" fill="none" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="698" y="461" class="r t">Plan</text>
  <text x="1140" y="461" class="f s" text-anchor="end">5 of 5</text>
  <text x="1188" y="461" class="f s" text-anchor="end">▸</text>
  <rect x="672" y="474" width="516" height="4" rx="2" class="bar"/>
  <text x="656" y="540" class="note">Unchanged rule: shown while a plan is in force</text>
  <text x="656" y="556" class="note">(the latest, not dropped, with steps), even when all done.</text>

  <!-- ===== iPHONE ===== -->
  <text x="640" y="606" class="h">REMOTE · iPHONE</text>
  <rect x="640.5" y="616" width="300" height="350" rx="32" fill="#fff" stroke="#c7c7cc"/>
  <text x="790" y="660" class="rb t" text-anchor="middle">Fix the sidebar row</text>
  <line x1="641" y1="676" x2="940" y2="676" stroke="#eceef2"/>
  <rect x="656" y="686" width="268" height="54" rx="10" class="well"/>
  <rect x="670" y="698" width="16" height="16" rx="3" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M673.5 706 l3 3 l6 -7" fill="none" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="694" y="711" class="r t">Fix the sidebar row</text>
  <text x="894" y="711" class="f s" text-anchor="end">2/5</text>
  <text x="912" y="711" class="f s" text-anchor="end">▸</text>
  <rect x="670" y="724" width="240" height="4" rx="2" class="track"/>
  <rect x="670" y="724" width="96" height="4" rx="2" class="bar"/>
  <text x="660" y="770" class="f s">Claude · 13:49</text>
  <text x="660" y="792" class="r t">Reading AgentRow.swift to</text>
  <text x="660" y="812" class="r t">see where the second line…</text>
  <text x="960" y="700" class="note">Same card, 16 pt margins.</text>
  <text x="960" y="716" class="note">A narrow width says "2/5";</text>
  <text x="960" y="732" class="note">a long step truncates at the end,</text>
  <text x="960" y="748" class="note">never the count.</text>
  <text x="960" y="784" class="note">Web: the same card in CSS,</text>
  <text x="960" y="800" class="note">.plan-strip on the page's well.</text>
</svg>
