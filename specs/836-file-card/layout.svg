<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="980" height="640" fill="#f6f6f4"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#222">#836 · The file card in the chat (option A, recommended)</text>
  <text x="24" y="56" font-size="12" fill="#666">Drawn where show_file was called, at every detail level (like an app view). A tap opens the file in the Files pane at its line.</text>

  <!-- chat column -->
  <rect x="24" y="76" width="520" height="540" rx="10" fill="#fff" stroke="#ddd"/>
  <text x="44" y="104" font-size="13" fill="#222">I counted the turns per runtime this week. Here is the chart:</text>

  <!-- A1: chart card -->
  <g transform="translate(44,120)">
    <rect width="340" height="214" rx="10" fill="#fff" stroke="#d6d6d6"/>
    <rect x="12" y="12" width="316" height="150" rx="6" fill="#fafafa"/>
    <g fill="#3d6fd8">
      <rect x="30" y="92" width="36" height="60"/>
      <rect x="84" y="52" width="36" height="100"/>
      <rect x="138" y="112" width="36" height="40"/>
      <rect x="192" y="72" width="36" height="80"/>
      <rect x="246" y="32" width="36" height="120"/>
    </g>
    <line x1="24" y1="152" x2="316" y2="152" stroke="#bbb"/>
    <g font-size="9" fill="#888"><text x="34" y="160">Claude</text><text x="88" y="160">Codex</text><text x="140" y="160">Grok</text><text x="194" y="160">Cursor</text><text x="246" y="160">OpenCode</text></g>
    <text x="14" y="184" font-size="13" fill="#3d6fd8">📊</text>
    <text x="34" y="184" font-size="13" font-weight="600" fill="#222">turns.vl.json</text>
    <text x="34" y="202" font-size="11" fill="#888">Bar chart · reports/</text>
    <text x="316" y="196" font-size="14" fill="#aaa" text-anchor="end">›</text>
  </g>
  <text x="400" y="230" font-size="11" fill="#c0392b">chart or picture:</text>
  <text x="400" y="245" font-size="11" fill="#c0392b">preview on top,</text>
  <text x="400" y="260" font-size="11" fill="#c0392b">≤ 340 wide, 150 tall</text>

  <text x="44" y="360" font-size="13" fill="#222">And the write-up is beside it:</text>

  <!-- A2: document card -->
  <g transform="translate(44,374)">
    <rect width="340" height="52" rx="10" fill="#fff" stroke="#d6d6d6"/>
    <text x="14" y="32" font-size="15" fill="#666">📄</text>
    <text x="38" y="24" font-size="13" font-weight="600" fill="#222">report.md</text>
    <text x="38" y="41" font-size="11" fill="#888">Page · reports/ · line 12</text>
    <text x="316" y="32" font-size="14" fill="#aaa" text-anchor="end">›</text>
  </g>
  <text x="400" y="400" font-size="11" fill="#c0392b">anything else: one line,</text>
  <text x="400" y="415" font-size="11" fill="#c0392b">icon, name, kind · folder</text>

  <!-- A3: picture card -->
  <g transform="translate(44,446)">
    <rect width="340" height="150" rx="10" fill="#fff" stroke="#d6d6d6"/>
    <rect x="12" y="12" width="316" height="86" rx="6" fill="#e8eef9"/>
    <circle cx="170" cy="55" r="26" fill="#3d6fd8" opacity="0.5"/>
    <text x="14" y="122" font-size="13" fill="#666">🖼</text>
    <text x="34" y="122" font-size="13" font-weight="600" fill="#222">architecture.svg</text>
    <text x="34" y="140" font-size="11" fill="#888">Picture · docs/</text>
    <text x="316" y="132" font-size="14" fill="#aaa" text-anchor="end">›</text>
  </g>

  <!-- option B -->
  <text x="580" y="104" font-size="15" font-weight="600" fill="#222">Option B: one row, small thumbnail</text>
  <g transform="translate(580,120)">
    <rect width="370" height="76" rx="10" fill="#fff" stroke="#d6d6d6"/>
    <rect x="10" y="10" width="80" height="56" rx="5" fill="#fafafa" stroke="#eee"/>
    <g fill="#3d6fd8"><rect x="20" y="40" width="10" height="20"/><rect x="36" y="26" width="10" height="34"/><rect x="52" y="46" width="10" height="14"/><rect x="68" y="20" width="10" height="40"/></g>
    <text x="104" y="34" font-size="13" font-weight="600" fill="#222">turns.vl.json</text>
    <text x="104" y="52" font-size="11" fill="#888">Bar chart · reports/</text>
    <text x="350" y="44" font-size="14" fill="#aaa" text-anchor="end">›</text>
  </g>
  <text x="580" y="222" font-size="11" fill="#666">Smaller in the chat, but a chart is too small to read;</text>
  <text x="580" y="237" font-size="11" fill="#666">you must open it to see anything.</text>

  <text x="580" y="290" font-size="15" font-weight="600" fill="#222">Option C: full-width chart inline</text>
  <g transform="translate(580,306)">
    <rect width="370" height="200" rx="10" fill="#fff" stroke="#d6d6d6"/>
    <g fill="#3d6fd8"><rect x="30" y="90" width="40" height="80"/><rect x="100" y="50" width="40" height="120"/><rect x="170" y="120" width="40" height="50"/><rect x="240" y="60" width="40" height="110"/><rect x="310" y="30" width="40" height="140"/></g>
    <text x="14" y="190" font-size="11" fill="#888">turns.vl.json</text>
  </g>
  <text x="580" y="532" font-size="11" fill="#666">Readable in place, but long chats with many</text>
  <text x="580" y="547" font-size="11" fill="#666">charts get tall; the phone loses the most.</text>
</svg>
