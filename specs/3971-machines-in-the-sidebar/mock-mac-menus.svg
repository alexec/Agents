<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <filter id="menu" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <symbol id="cloud" viewBox="0 0 16 16"><path d="M4.2 12.5h7.6a2.9 2.9 0 0 0 .4-5.8 4.2 4.2 0 0 0-8.1-.9 3.4 3.4 0 0 0 .1 6.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="chev-down" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chev-right" viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
  <rect width="1000" height="560" fill="#E7EAEE"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1C1D20">Mac · menus and the Delete confirmation</text>
  <text x="24" y="54" font-size="12" fill="#6B7280">Hi-fi mock for #3971 · New Machine asks no questions; only Delete and Remove confirm</text>

  <!-- ===== A: header menu ===== -->
  <g transform="translate(24,80)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#3F444B">Right-click "Machines"</text>
    <rect y="14" width="300" height="34" rx="8" fill="#F0F1F3"/>
    <use href="#chev-down" x="14" y="26" width="10" height="10" color="#8A9099"/>
    <text x="30" y="35" font-size="11" font-weight="600" fill="#8A9099">Machines</text>

    <g transform="translate(60,40)" filter="url(#menu)">
      <rect width="250" height="128" rx="7" fill="#FFFFFF" fill-opacity=".97" stroke="#00000014"/>
    </g>
    <g transform="translate(60,40)" font-size="13" fill="#1C1D20">
      <rect x="5" y="5" width="240" height="22" rx="4" fill="#0A84FF"/>
      <text x="14" y="20" fill="#fff">New Machine (DigitalOcean)</text>
      <text x="236" y="20" fill="#fff" text-anchor="end">⇧⌘M</text>
      <text x="14" y="44">New Machine on</text>
      <use href="#chev-right" x="228" y="34" width="10" height="10" color="#5B616A"/>
      <path d="M10 56h230" stroke="#E2E5E9"/>
      <text x="14" y="76">Register a Machine…</text>
      <text x="14" y="98">Machine Providers…</text>
      <path d="M10 108h230" stroke="#E2E5E9"/>
      <text x="14" y="122" font-size="11" fill="#8A9099">Next name: machine-9</text>
    </g>
    <!-- submenu -->
    <g transform="translate(306,66)" filter="url(#menu)">
      <rect width="150" height="78" rx="7" fill="#FFFFFF" fill-opacity=".97" stroke="#00000014"/>
    </g>
    <g transform="translate(306,66)" font-size="13" fill="#1C1D20">
      <text x="14" y="20">✓</text><text x="30" y="20">DigitalOcean</text>
      <text x="30" y="44">Docker</text>
      <text x="30" y="68">Codespaces</text>
    </g>

    <g font-size="11.5" fill="#3F444B" transform="translate(0,200)">
      <text x="0" y="0">One click makes the machine, at once:</text>
      <text x="0" y="17" fill="#6B7280">the next number, the last-used provider and</text>
      <text x="0" y="34" fill="#6B7280">its last-used size and region. With one provider,</text>
      <text x="0" y="51" fill="#6B7280">"New Machine on" goes. With none: New Machine…</text>
      <text x="0" y="68" fill="#6B7280">opens Add Provider, the only form.</text>
    </g>
    <!-- result row -->
    <g transform="translate(0,290)">
      <rect width="300" height="44" rx="8" fill="#F0F1F3"/>
      <use href="#cloud" x="12" y="9" width="16" height="16" color="#5B616A"/>
      <text x="36" y="22" font-size="13" fill="#1C1D20">machine-9</text>
      <text x="36" y="36" font-size="11" fill="#8A9099">Making on DigitalOcean…</text>
      <circle cx="284" cy="18" r="3.6" fill="none" stroke="#FF9F0A" stroke-opacity=".3" stroke-width="1.6"/>
      <path d="M284 14.4a3.6 3.6 0 0 1 3.6 3.6" fill="none" stroke="#FF9F0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== B: row menu ===== -->
  <g transform="translate(500,80)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#3F444B">Right-click machine-1 (made by a provider)</text>
    <rect y="14" width="210" height="30" rx="6" fill="#D8DEE6"/>
    <use href="#cloud" x="12" y="21" width="16" height="16" color="#5B616A"/>
    <text x="36" y="34" font-size="13" fill="#1C1D20">machine-1</text>
    <circle cx="196" cy="29" r="4" fill="#34C759"/>

    <g transform="translate(40,40)" filter="url(#menu)">
      <rect width="220" height="262" rx="7" fill="#FFFFFF" fill-opacity=".97" stroke="#00000014"/>
    </g>
    <g transform="translate(40,40)" font-size="13" fill="#1C1D20">
      <text x="14" y="22">Open</text>
      <path d="M10 32h200" stroke="#E2E5E9"/>
      <rect x="5" y="37" width="210" height="22" rx="4" fill="#0A84FF"/>
      <text x="14" y="52" fill="#fff">Stop</text>
      <text x="14" y="76">Check Again</text>
      <text x="14" y="98">Update…</text>
      <path d="M10 108h200" stroke="#E2E5E9"/>
      <text x="14" y="128">Rename</text>
      <text x="14" y="150">Choose Folders…</text>
      <text x="14" y="172">Backups…</text>
      <text x="14" y="194">Processes…</text>
      <path d="M10 204h200" stroke="#E2E5E9"/>
      <text x="14" y="224" fill="#FF3B30">Delete machine-1…</text>
      <text x="14" y="248" font-size="11" fill="#8A9099">Made on DigitalOcean · nyc3 · s-2vcpu</text>
    </g>
  </g>

  <!-- ===== C: delete sheet ===== -->
  <g transform="translate(770,80)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#3F444B">Delete confirms</text>
    <g transform="translate(0,16)" filter="url(#menu)">
      <rect width="210" height="290" rx="12" fill="#FFFFFF"/>
    </g>
    <g transform="translate(0,16)">
      <rect x="85" y="18" width="40" height="40" rx="9" fill="#FFE5E3"/>
      <use href="#cloud" x="93" y="26" width="24" height="24" color="#FF3B30"/>
      <text x="105" y="82" font-size="13" font-weight="600" fill="#1C1D20" text-anchor="middle">Delete machine-1?</text>
      <g font-size="11" fill="#3F444B" text-anchor="middle">
        <text x="105" y="104">DigitalOcean destroys this</text>
        <text x="105" y="119">machine and its disk.</text>
        <text x="105" y="139">2 sessions on it stop.</text>
      </g>
      <rect x="14" y="152" width="182" height="52" rx="7" fill="#FFF4E0"/>
      <text x="24" y="170" font-size="11" font-weight="600" fill="#8A5A00">Work not pushed</text>
      <text x="24" y="186" font-size="11" fill="#5C4300">Agents · agents/fix-3928</text>
      <text x="24" y="199" font-size="10.5" fill="#8A5A00">3 commits</text>
      <rect x="14" y="218" width="182" height="26" rx="7" fill="#FF3B30"/>
      <text x="105" y="235" font-size="13" fill="#fff" text-anchor="middle">Delete</text>
      <rect x="14" y="250" width="182" height="26" rx="7" fill="#E7EAEE"/>
      <text x="105" y="267" font-size="13" fill="#1C1D20" text-anchor="middle">Cancel</text>
    </g>
    <text x="0" y="336" font-size="11" fill="#6B7280">Start never asks. Stop asks only</text>
    <text x="0" y="351" font-size="11" fill="#6B7280">when sessions run on it. Remove</text>
    <text x="0" y="366" font-size="11" fill="#6B7280">says the computer and its files stay.</text>
  </g>
</svg>
