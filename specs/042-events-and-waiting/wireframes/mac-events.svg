<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; } .s { fill:#6e6e73; } .q { fill:#aeaeb2; }
    .ti { font-size:20px; font-weight:700; } .rb { font-size:14px; font-weight:600; } .r { font-size:14px; }
    .sup { font-size:13px; } .f { font-size:12px; } .m { font-size:11.5px; font-family: Menlo, monospace; }
    .cap { fill:#fbfbfd; stroke:#d1d1d6; } .capOn { fill:#e5e5ea; stroke:#c7c7cc; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
    .link { fill:#1d1d1f; text-decoration: underline; }
  </style>
  <rect x="0.5" y="0.5" width="1279" height="819" rx="12" fill="#fff" stroke="#c7c7cc"/>

  <!-- sidebar -->
  <rect x="0.5" y="0.5" width="220" height="819" rx="12" fill="#f5f5f7" stroke="#e5e5ea"/>
  <text x="18" y="36" class="rb t">Projects</text>
  <text x="18" y="66" class="r t">Agents</text>
  <text x="18" y="92" class="r t">website</text>
  <text x="18" y="118" class="r t">dotfiles</text>
  <line x1="12" y1="640" x2="208" y2="640" stroke="#e5e5ea"/>
  <rect x="10" y="650" width="200" height="48" rx="8" fill="#e5e5ea"/>
  <text x="22" y="670" class="rb t">Events</text>
  <text x="22" y="688" class="f s">Last 07:40</text>
  <rect x="10" y="704" width="200" height="48" rx="8" fill="none"/>
  <text x="22" y="724" class="rb t">Resources</text>
  <text x="22" y="742" class="f s">1 held</text>
  <rect x="10" y="758" width="200" height="48" rx="8" fill="none"/>
  <text x="22" y="778" class="rb t">Spending</text>
  <text x="22" y="796" class="f s">$4.12 today</text>
  <text x="18" y="560" class="note">New foot row, same shape as</text>
  <text x="18" y="576" class="note">Resources and Spending. No</text>
  <text x="18" y="592" class="note">count, no badge: a record,</text>
  <text x="18" y="608" class="note">not a need.</text>

  <!-- page header -->
  <text x="248" y="44" class="ti t">Events</text>
  <rect x="248" y="60" width="150" height="26" rx="6" class="cap"/>
  <text x="258" y="78" class="sup t">All projects ▾</text>
  <rect x="408" y="60" width="44" height="26" rx="13" class="capOn"/><text x="421" y="78" class="sup t">All</text>
  <rect x="458" y="60" width="66" height="26" rx="13" class="cap"/><text x="470" y="78" class="sup t">Agents</text>
  <rect x="530" y="60" width="90" height="26" rx="13" class="cap"/><text x="542" y="78" class="sup t">Workflows</text>
  <rect x="626" y="60" width="110" height="26" rx="13" class="cap"/><text x="638" y="78" class="sup t">Pull requests</text>
  <rect x="742" y="60" width="84" height="26" rx="13" class="cap"/><text x="754" y="78" class="sup t">Branches</text>
  <rect x="832" y="60" width="80" height="26" rx="13" class="cap"/><text x="844" y="78" class="sup t">This Mac</text>
  <rect x="918" y="60" width="70" height="26" rx="13" class="cap"/><text x="930" y="78" class="sup t">Custom</text>

  <!-- waiting now strip -->
  <rect x="248" y="100" width="740" height="62" rx="10" fill="#f5f5f7"/>
  <text x="262" y="120" class="f s">WAITING NOW</text>
  <text x="262" y="144" class="sup t">◷ <tspan class="link">Deploy docs</tspan> · pull_request.merged #44 · since 06:58 · until 09:00</text>
  <text x="966" y="144" class="r s">✕</text>

  <!-- list -->
  <text x="248" y="192" class="f s">TODAY</text>

  <!-- row: person.back -->
  <text x="248" y="220" class="sup s">07:40</text>
  <text x="300" y="220" class="r t">⌘  You came back to the Mac (unlocked)</text>
  <text x="322" y="238" class="m s">person.back · This Mac</text>
  <line x1="248" y1="252" x2="988" y2="252" stroke="#f0f0f2"/>

  <!-- row: mac.wake -->
  <text x="248" y="276" class="sup s">07:12</text>
  <text x="300" y="276" class="r t">⌘  The Mac woke</text>
  <text x="322" y="294" class="m s">mac.wake · This Mac</text>
  <line x1="248" y1="308" x2="988" y2="308" stroke="#f0f0f2"/>

  <!-- row: PR merged, selected -->
  <rect x="244" y="314" width="748" height="112" rx="8" fill="#ececf0"/>
  <text x="248" y="336" class="sup s">06:55</text>
  <text x="300" y="336" class="r t">⑂  #41 “Events log” was merged into main</text>
  <text x="322" y="354" class="m s">pull_request.merged · Agents</text>
  <text x="322" y="378" class="sup s">↳ Woke <tspan class="link">Clean up after #41</tspan></text>
  <text x="322" y="398" class="sup s">↳ Fired <tspan class="link">Release notes</tspan> → <tspan class="link">Release notes · 26 Sep</tspan></text>
  <text x="322" y="418" class="sup s">↳ Refused by <tspan class="link">Babysit my PRs</tspan>: a run is still in flight</text>

  <!-- row: branch moved -->
  <text x="248" y="452" class="sup s">06:55</text>
  <text x="300" y="452" class="r t">⎇  main moved from 8f2c1d0 to a41e9b2</text>
  <text x="322" y="470" class="m s">branch.moved · Agents</text>
  <line x1="248" y1="484" x2="988" y2="484" stroke="#f0f0f2"/>

  <!-- row: custom -->
  <text x="248" y="508" class="sup s">03:10</text>
  <text x="300" y="508" class="r t">✦  Nightly build: “All 1,517 tests green on main at 8f2c1d0.”</text>
  <text x="322" y="526" class="m s">custom.build_green · Agents · published by <tspan class="link">Nightly build</tspan></text>
  <text x="322" y="548" class="sup s">↳ Woke <tspan class="link">Merge when green</tspan></text>
  <line x1="248" y1="562" x2="988" y2="562" stroke="#f0f0f2"/>

  <!-- row: checks failed -->
  <text x="248" y="586" class="sup s">02:04</text>
  <text x="300" y="586" class="r t">⑂  Checks failed on #41 “Events log”</text>
  <text x="322" y="604" class="m s">pull_request.checks_failed · Agents</text>
  <text x="322" y="626" class="sup s">↳ Fired <tspan class="link">Babysit my PRs</tspan> → <tspan class="link">Babysit #41</tspan></text>
  <line x1="248" y1="640" x2="988" y2="640" stroke="#f0f0f2"/>

  <!-- row: agent finished repeated -->
  <text x="248" y="664" class="sup s">01:30</text>
  <text x="300" y="664" class="r t">●  <tspan class="link">Nightly build</tspan> finished: done</text>
  <text x="322" y="682" class="m s">agent.finished · Agents</text>
  <line x1="248" y1="696" x2="988" y2="696" stroke="#f0f0f2"/>

  <!-- row: sleep -->
  <text x="248" y="720" class="sup s">00:15</text>
  <text x="300" y="720" class="r t">⌘  The Mac went to sleep</text>
  <text x="322" y="738" class="m s">mac.sleep · This Mac</text>
  <line x1="248" y1="752" x2="988" y2="752" stroke="#f0f0f2"/>

  <text x="248" y="780" class="f s">YESTERDAY</text>
  <text x="248" y="806" class="sup s">23:48</text>
  <text x="300" y="806" class="r t">⎇  feature/x moved ×4</text>

  <!-- detail pane -->
  <line x1="1008" y1="0" x2="1008" y2="820" stroke="#e5e5ea"/>
  <text x="1026" y="44" class="rb t">pull_request.merged</text>
  <text x="1026" y="64" class="f s">Today 06:55 · Agents</text>
  <text x="1026" y="100" class="f s">Pull request</text><text x="1136" y="100" class="f t">#41 Events log</text>
  <text x="1026" y="122" class="f s">Base</text><text x="1136" y="122" class="f t">main</text>
  <text x="1026" y="144" class="f s">Merged by</text><text x="1136" y="144" class="f t">alexec</text>
  <text x="1026" y="166" class="f s">Position</text><text x="1136" y="166" class="f t">4,812</text>
  <rect x="1026" y="190" width="150" height="28" rx="6" class="cap"/>
  <text x="1040" y="209" class="sup t">Copy as trigger</text>
  <text x="1026" y="248" class="note">Copies</text>
  <text x="1026" y="264" class="note">on: pull_request.merged</text>
  <text x="1026" y="280" class="note">  pull_request: 41</text>
  <text x="1026" y="296" class="note">for a workflow file.</text>

  <text x="1026" y="360" class="note">Consequences: Woke, Fired,</text>
  <text x="1026" y="376" class="note">Refused by, Could not wake.</text>
  <text x="1026" y="392" class="note">Words, not colour. Every</text>
  <text x="1026" y="408" class="note">name is a link (FR-027).</text>

  <text x="1026" y="460" class="note">Monospace name on every</text>
  <text x="1026" y="476" class="note">row: the log is where the</text>
  <text x="1026" y="492" class="note">vocabulary is learnt.</text>

  <text x="1026" y="544" class="note">Repeats in 60 s fold into</text>
  <text x="1026" y="560" class="note">one row with ×N (FR-031).</text>
</svg>
