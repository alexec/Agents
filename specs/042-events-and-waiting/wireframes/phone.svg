<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; } .s { fill:#6e6e73; } .q { fill:#aeaeb2; }
    .ti { font-size:22px; font-weight:700; } .rb { font-size:15px; font-weight:600; } .r { font-size:15px; }
    .sup { font-size:13px; } .f { font-size:12px; } .m { font-size:11px; font-family: Menlo, monospace; }
    .cap { fill:#fbfbfd; stroke:#d1d1d6; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
    .link { fill:#1d1d1f; text-decoration: underline; }
  </style>

  <!-- phone 1: project list foot -->
  <rect x="20" y="20" width="340" height="720" rx="40" fill="#fff" stroke="#c7c7cc" stroke-width="2"/>
  <text x="44" y="84" class="ti t">Projects</text>
  <rect x="36" y="104" width="308" height="52" rx="12" fill="#f5f5f7"/><text x="52" y="136" class="r t">Agents</text>
  <rect x="36" y="162" width="308" height="52" rx="12" fill="#f5f5f7"/><text x="52" y="194" class="r t">website</text>
  <rect x="36" y="250" width="308" height="52" rx="12" fill="#ececf0"/>
  <text x="52" y="274" class="r t">Events</text><text x="52" y="292" class="f s">Last 07:40</text><text x="326" y="282" class="r q">›</text>
  <rect x="36" y="308" width="308" height="52" rx="12" fill="#f5f5f7"/>
  <text x="52" y="332" class="r t">Spending</text><text x="52" y="350" class="f s">$4.12 today</text><text x="326" y="340" class="r q">›</text>
  <text x="44" y="400" class="note">Beside Spending, same shape (FR-029).</text>

  <!-- phone 2: events list -->
  <rect x="410" y="20" width="340" height="720" rx="40" fill="#fff" stroke="#c7c7cc" stroke-width="2"/>
  <text x="430" y="62" class="r link">‹ Projects</text>
  <text x="434" y="96" class="ti t">Events</text>
  <rect x="630" y="76" width="104" height="28" rx="14" class="cap"/><text x="642" y="95" class="sup t">All ▾</text>
  <text x="434" y="130" class="f s">TODAY</text>

  <text x="434" y="156" class="sup s">07:40</text><text x="480" y="156" class="sup t">You came back to the Mac</text>
  <text x="480" y="172" class="m s">person.back · This Mac</text>
  <line x1="434" y1="184" x2="730" y2="184" stroke="#f0f0f2"/>
  <text x="434" y="206" class="sup s">07:12</text><text x="480" y="206" class="sup t">The Mac woke</text>
  <text x="480" y="222" class="m s">mac.wake · This Mac</text>
  <text x="480" y="242" class="f s">↳ Fired Catch up → <tspan class="link">Catch up</tspan></text>
  <line x1="434" y1="254" x2="730" y2="254" stroke="#f0f0f2"/>
  <text x="434" y="276" class="sup s">06:55</text><text x="480" y="276" class="sup t">#41 “Events log” was merged</text>
  <text x="480" y="292" class="m s">pull_request.merged · Agents</text>
  <text x="480" y="312" class="f s">↳ Woke <tspan class="link">Clean up after #41</tspan></text>
  <text x="480" y="330" class="f s">↳ Fired Release notes → <tspan class="link">Release notes</tspan></text>
  <text x="480" y="348" class="f s">↳ Refused by Babysit my PRs: in flight</text>
  <line x1="434" y1="360" x2="730" y2="360" stroke="#f0f0f2"/>
  <text x="434" y="382" class="sup s">03:10</text><text x="480" y="382" class="sup t">Nightly build: “All 1,517 tests</text>
  <text x="480" y="398" class="sup t">green on main at 8f2c1d0.”</text>
  <text x="480" y="414" class="m s">custom.build_green · Agents</text>
  <text x="480" y="434" class="f s">↳ Woke <tspan class="link">Merge when green</tspan></text>
  <line x1="434" y1="446" x2="730" y2="446" stroke="#f0f0f2"/>
  <text x="434" y="468" class="sup s">02:04</text><text x="480" y="468" class="sup t">Checks failed on #41</text>
  <text x="480" y="484" class="m s">pull_request.checks_failed · Agents</text>
  <text x="480" y="504" class="f s">↳ Fired Babysit my PRs → <tspan class="link">Babysit #41</tspan></text>

  <text x="434" y="560" class="note">One menu: All, This Mac, each project.</text>
  <text x="434" y="576" class="note">Agent names link to chats; workflow</text>
  <text x="434" y="592" class="note">names are plain (no workflow page).</text>
  <text x="434" y="608" class="note">Tap a row → read-only detail sheet.</text>
  <text x="434" y="624" class="note">No Waiting now strip, no ✕, no</text>
  <text x="434" y="640" class="note">Copy as trigger on phone/iPad.</text>

  <!-- phone 3: waiting chat -->
  <rect x="800" y="20" width="340" height="720" rx="40" fill="#fff" stroke="#c7c7cc" stroke-width="2"/>
  <text x="820" y="62" class="r link">‹ Agents</text>
  <text x="824" y="96" class="rb t">Deploy docs</text>
  <rect x="930" y="120" width="190" height="44" rx="14" fill="#e5e5ea"/>
  <text x="942" y="147" class="sup t">Deploy once #44 merges.</text>
  <text x="824" y="194" class="sup t">#44 isn't merged yet. I'll wait</text>
  <text x="824" y="212" class="sup t">for it rather than poll.</text>
  <rect x="824" y="224" width="296" height="54" rx="8" fill="#f5f5f7"/>
  <text x="836" y="244" class="m t">wait_for_event pull_request.merged</text>
  <text x="836" y="266" class="f s">Still waiting; you can end your turn.</text>

  <rect x="824" y="590" width="296" height="28" rx="14" class="cap"/>
  <text x="836" y="609" class="f s">◷ Waiting for pull_request.merged · #44</text>
  <text x="824" y="638" class="f s">~/Agents · 38% · Claude</text>
  <text x="824" y="656" class="f s">Sending will cancel the wait.</text>
  <rect x="824" y="666" width="296" height="48" rx="24" fill="#fbfbfd" stroke="#d1d1d6"/>
  <text x="842" y="696" class="r q">Message…</text>

  <text x="824" y="420" class="note">Shared PromptHeader capsule,</text>
  <text x="824" y="436" class="note">no ✕ here: the phone cancels</text>
  <text x="824" y="452" class="note">by prompting, which the hint</text>
  <text x="824" y="468" class="note">line says. Tap capsule → sheet</text>
  <text x="824" y="484" class="note">with since/until in full.</text>
</svg>
