<svg xmlns="http://www.w3.org/2000/svg" width="860" height="820" viewBox="0 0 860 820" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; }
    .s { fill:#6e6e73; }
    .q { fill:#aeaeb2; }
    .title { font-size:28px; font-weight:700; }
    .h { font-size:12px; font-weight:600; fill:#6e6e73; letter-spacing:.3px; }
    .r { font-size:15px; }
    .rb { font-size:15px; font-weight:600; }
    .f { font-size:12px; }
    .btn { fill:#fff; stroke:#c7c7cc; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
    .out { fill:#c93400; }
  </style>

  <!-- phone 1: pool -->
  <rect x="20.5" y="20.5" width="390" height="780" rx="44" fill="#f2f2f7" stroke="#c7c7cc"/>
  <text x="44" y="70" class="f t">02:20</text>
  <text x="44" y="104" class="r t">‹ Activity</text>
  <text x="44" y="146" class="title t">Pool</text>

  <text x="44" y="186" class="h">RUNTIMES</text>
  <rect x="36" y="194" width="358" height="228" rx="12" fill="#fff"/>
  <circle cx="58" cy="220" r="5" class="out"/><text x="72" y="225" class="rb t">Claude</text>
  <text x="72" y="245" class="f out">Out until 07:00</text>
  <line x1="72" y1="260" x2="394" y2="260" stroke="#e5e5ea"/>
  <circle cx="58" cy="280" r="5" class="out"/><text x="72" y="285" class="rb t">Copilot</text>
  <text x="72" y="305" class="f out">Out since 02:14 · retrying after 03:14</text>
  <line x1="72" y1="320" x2="394" y2="320" stroke="#e5e5ea"/>
  <circle cx="58" cy="340" r="5" fill="#34c759"/><text x="72" y="345" class="rb t">Codex</text>
  <text x="72" y="365" class="f s">Available · 3 chats</text>
  <line x1="72" y1="380" x2="394" y2="380" stroke="#e5e5ea"/>
  <circle cx="58" cy="400" r="5" fill="none" stroke="#aeaeb2"/><text x="72" y="405" class="rb q">Cursor</text>
  <text x="140" y="405" class="f s">not signed in</text>

  <text x="44" y="452" class="h">RECENT SWITCHES</text>
  <rect x="36" y="460" width="358" height="130" rx="12" fill="#fff"/>
  <text x="52" y="486" class="rb t">Docs pass</text><text x="378" y="486" class="f s" text-anchor="end">02:14</text>
  <text x="52" y="506" class="f s">Copilot → Codex · ran out · Everyday</text>
  <line x1="52" y1="520" x2="394" y2="520" stroke="#e5e5ea"/>
  <text x="52" y="546" class="rb t">Fix login</text><text x="378" y="546" class="f s" text-anchor="end">02:03</text>
  <text x="52" y="566" class="f s">Claude → Codex · ran out · Strongest</text>

  <text x="44" y="620" class="h">MATCHING MODELS</text>
  <rect x="36" y="628" width="358" height="132" rx="12" fill="#fff"/>
  <text x="52" y="654" class="rb t">Strongest</text><text x="378" y="654" class="f q" text-anchor="end">›</text>
  <text x="52" y="674" class="f s">Opus 5.5 · Opus 5.5 (Copilot) · GPT-5 Codex</text>
  <line x1="52" y1="688" x2="394" y2="688" stroke="#e5e5ea"/>
  <text x="52" y="714" class="rb t">Everyday</text><text x="378" y="714" class="f q" text-anchor="end">›</text>
  <text x="52" y="734" class="f s">Sonnet 5 · GPT-5 · GPT-5 Codex</text>

  <!-- phone 2: a level -->
  <rect x="450.5" y="20.5" width="390" height="780" rx="44" fill="#f2f2f7" stroke="#c7c7cc"/>
  <text x="474" y="70" class="f t">02:20</text>
  <text x="474" y="104" class="r t">‹ Pool</text>
  <text x="474" y="146" class="title t">Strongest</text>
  <rect x="466" y="170" width="358" height="228" rx="12" fill="#fff"/>
  <text x="482" y="200" class="r t">Claude</text><text x="808" y="200" class="r s" text-anchor="end">Opus 5.5 · high ›</text>
  <line x1="482" y1="216" x2="824" y2="216" stroke="#e5e5ea"/>
  <text x="482" y="246" class="r t">Copilot</text><text x="808" y="246" class="r s" text-anchor="end">Opus 5.5 ›</text>
  <line x1="482" y1="262" x2="824" y2="262" stroke="#e5e5ea"/>
  <text x="482" y="292" class="r t">Codex</text><text x="808" y="292" class="r s" text-anchor="end">GPT-5 Codex · high ›</text>
  <line x1="482" y1="308" x2="824" y2="308" stroke="#e5e5ea"/>
  <text x="482" y="338" class="r t">Cursor</text><text x="808" y="338" class="r q" text-anchor="end">Choose ›</text>
  <line x1="482" y1="354" x2="824" y2="354" stroke="#e5e5ea"/>
  <text x="482" y="382" class="r out">Delete level</text>

  <text x="466" y="436" class="note">The Mac's grid is too wide for a phone, so each</text>
  <text x="466" y="452" class="note">level is a row that opens to one line per runtime.</text>
  <text x="466" y="484" class="note">Mark available is a swipe on a runtime row that is</text>
  <text x="466" y="500" class="note">out. Switches open their chat. The phone shows</text>
  <text x="466" y="516" class="note">the Pool row wherever it shows Spending, with the</text>
  <text x="466" y="532" class="note">same dot when anything is out (FR-019, FR-024).</text>
  <text x="466" y="564" class="note">Continue with… on the phone is the same sheet as a</text>
  <text x="466" y="580" class="note">list: one row per setting, old value under the new.</text>
</svg>
