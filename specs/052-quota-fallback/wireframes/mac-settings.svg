<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, 'SF Pro Text', Helvetica, sans-serif">
  <style>
    .t { fill:#1d1d1f; }
    .s { fill:#6e6e73; }
    .q { fill:#aeaeb2; }
    .h { font-size:13px; font-weight:600; fill:#6e6e73; letter-spacing:.3px; }
    .r { font-size:14px; }
    .rb { font-size:14px; font-weight:600; }
    .f { font-size:12px; }
    .btn { fill:#fff; stroke:#c7c7cc; }
    .note { font-size:12px; fill:#b0006a; font-style:italic; }
  </style>

  <rect x="0.5" y="0.5" width="759" height="559" rx="12" fill="#fff" stroke="#c7c7cc"/>
  <rect x="0.5" y="0.5" width="759" height="78" rx="12" fill="#f5f5f7"/>
  <circle cx="22" cy="20" r="6" fill="#d1d1d6"/><circle cx="42" cy="20" r="6" fill="#d1d1d6"/><circle cx="62" cy="20" r="6" fill="#d1d1d6"/>
  <!-- tabs -->
  <text x="150" y="64" class="f s" text-anchor="middle">Appearance</text>
  <text x="240" y="64" class="f s" text-anchor="middle">Agents</text>
  <text x="320" y="64" class="f s" text-anchor="middle">Spending</text>
  <rect x="366" y="46" width="68" height="26" rx="6" fill="#dcdce1"/>
  <text x="400" y="64" class="f t" text-anchor="middle">Pool</text>
  <text x="480" y="64" class="f s" text-anchor="middle">Devices</text>
  <text x="560" y="64" class="f s" text-anchor="middle">Servers</text>

  <!-- switch -->
  <text x="40" y="118" class="rb t">Carry chats on with the next runtime when one runs out</text>
  <rect x="660" y="102" width="44" height="24" rx="12" fill="#34c759"/><circle cx="692" cy="114" r="10" fill="#fff"/>
  <text x="40" y="138" class="f s">Offers to carry on at pay-as-you-go prices are always turned down. Needs two runtimes or more.</text>

  <text x="40" y="180" class="h">THE POOL, IN THE ORDER TO TRY</text>
  <rect x="40" y="190" width="680" height="200" rx="10" fill="#fff" stroke="#e5e5ea"/>

  <text x="56" y="220" class="r q">≡</text><text x="80" y="220" class="rb t">Claude</text>
  <rect x="400" y="204" width="180" height="26" rx="6" class="btn"/><text x="410" y="222" class="f s">Model: as the chat had</text><text x="570" y="222" class="f q" text-anchor="end">▾</text>
  <text x="704" y="221" class="f s" text-anchor="end">Remove</text>
  <line x1="56" y1="240" x2="704" y2="240" stroke="#f2f2f7"/>
  <text x="56" y="266" class="r q">≡</text><text x="80" y="266" class="rb t">Copilot</text>
  <rect x="400" y="250" width="180" height="26" rx="6" class="btn"/><text x="410" y="268" class="f s">Model: as the chat had</text><text x="570" y="268" class="f q" text-anchor="end">▾</text>
  <text x="704" y="267" class="f s" text-anchor="end">Remove</text>
  <line x1="56" y1="286" x2="704" y2="286" stroke="#f2f2f7"/>
  <text x="56" y="312" class="r q">≡</text><text x="80" y="312" class="rb t">Codex</text>
  <rect x="400" y="296" width="180" height="26" rx="6" class="btn"/><text x="410" y="314" class="f t">GPT-5 Codex · medium</text><text x="570" y="314" class="f q" text-anchor="end">▾</text>
  <text x="704" y="313" class="f s" text-anchor="end">Remove</text>
  <line x1="56" y1="332" x2="704" y2="332" stroke="#f2f2f7"/>
  <text x="56" y="358" class="r q">≡</text><text x="80" y="358" class="rb q">Cursor</text>
  <text x="140" y="358" class="f s">not signed in, so skipped</text>
  <text x="704" y="359" class="f s" text-anchor="end">Remove</text>

  <rect x="40" y="404" width="160" height="28" rx="6" class="btn"/><text x="120" y="423" class="f t" text-anchor="middle">Add a runtime ▾</text>
  <text x="214" y="422" class="f s">Only installed, signed-in runtimes can be added. Grok is the one left.</text>

  <text x="40" y="468" class="rb t">Matching models</text>
  <text x="40" y="488" class="f s">Which model stands in for which is kept on the Pool page.</text>
  <text x="400" y="488" class="f t" text-decoration="underline">Open the Pool page ›</text>

  <text x="40" y="528" class="note">“Model” is used only when the chat's model is in no Matching models level (FR-015). “As the chat had” means the</text>
  <text x="40" y="544" class="note">model last chosen for that runtime. Drag ≡ to reorder. A per-chat “don't switch” lives in the chat's runtime menu.</text>
</svg>
