<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#20242A" flood-opacity="0.18"/>
    </filter>
    <symbol id="more" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#1F5FC8" stroke-width="1.2"/>
      <circle cx="4.8" cy="8" r="1" fill="#1F5FC8"/><circle cx="8" cy="8" r="1" fill="#1F5FC8"/><circle cx="11.2" cy="8" r="1" fill="#1F5FC8"/>
    </symbol>
    <symbol id="warn" viewBox="0 0 16 16">
      <path d="M8 1.5 L15 14 H1 Z" fill="#C2620A" stroke="#C2620A" stroke-width="1" stroke-linejoin="round"/>
      <rect x="7.3" y="5.5" width="1.4" height="4.6" rx="0.7" fill="#fff"/><circle cx="8" cy="12" r="0.85" fill="#fff"/>
    </symbol>
    <symbol id="hand" viewBox="0 0 16 16">
      <path d="M5 14 C3 12 2.5 10 2.5 8.5 V6.5 a1 1 0 0 1 2 0 V8 V3 a1 1 0 0 1 2 0 V7 V2.2 a1 1 0 0 1 2 0 V7 V3 a1 1 0 0 1 2 0 V8.5 V6 a1 1 0 0 1 2 0 V10 C12.5 12.5 11 14 9 14 Z" fill="none" stroke="#6B7078" stroke-width="1.1" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="920" height="720" fill="#D9DDE2"/>

  <!-- The Settings window -->
  <g filter="url(#shadow)">
    <rect x="30" y="24" width="860" height="672" rx="12" fill="#F7F8F9"/>
  </g>
  <path d="M30 36 a12 12 0 0 1 12 -12 H254 V696 H42 a12 12 0 0 1 -12 -12 Z" fill="#F0F1F3"/>
  <line x1="254" y1="24" x2="254" y2="696" stroke="#DDE1E6"/>
  <circle cx="52" cy="46" r="6" fill="#FF5F57"/><circle cx="72" cy="46" r="6" fill="#FEBC2E"/><circle cx="92" cy="46" r="6" fill="#28C840"/>

  <!-- The rail -->
  <g font-size="11" fill="#8A8F97" font-weight="600">
    <text x="48" y="92">You</text>
    <text x="48" y="212">This app</text>
    <text x="48" y="296">Machines</text>
  </g>
  <g font-size="13" fill="#1C1D20">
    <text x="72" y="118">Connectors</text>
    <rect x="40" y="130" width="202" height="26" rx="6" fill="#1F5FC8"/>
    <text x="72" y="148" fill="#fff" font-weight="500">Secrets</text>
    <text x="72" y="178">Accounts</text>
    <text x="72" y="238">Appearance</text>
    <text x="72" y="264">Notifications</text>
    <text x="72" y="322">Machines</text>
    <text x="72" y="348">Agent Runtimes</text>
  </g>
  <g fill="none" stroke="#1F5FC8" stroke-width="1.3">
    <rect x="50" y="108" width="13" height="11" rx="2"/>
    <rect x="50" y="168" width="13" height="11" rx="6"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.3"><circle cx="54" cy="143" r="3.5"/><path d="M57 143 H64 M62 143 V146"/></g>

  <!-- The pane -->
  <text x="290" y="72" font-size="20" font-weight="700" fill="#1C1D20">Secrets</text>

  <rect x="290" y="92" width="560" height="372" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/>

  <!-- Row 1 -->
  <text x="308" y="120" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1C1D20">GITHUB_TOKEN</text>
  <text x="790" y="120" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8A8F97" text-anchor="end" letter-spacing="0.5">••••ab12</text>
  <use href="#more" x="808" y="108" width="16" height="16"/>
  <text x="308" y="139" font-size="11" fill="#6B7078">On 3 machines · Added 27 d ago · Used 2 h ago</text>
  <use href="#hand" x="308" y="147" width="12" height="12"/>
  <text x="324" y="157" font-size="11" fill="#6B7078">Asks before use</text>
  <line x1="308" y1="172" x2="850" y2="172" stroke="#DDE1E6"/>

  <!-- Row 2: a card -->
  <text x="308" y="198" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1C1D20">SHOP_CARD</text>
  <rect x="392" y="186" width="36" height="16" rx="4" fill="#F0F2F4"/>
  <text x="410" y="198" font-size="10" fill="#6B7078" text-anchor="middle">Card</text>
  <text x="790" y="198" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8A8F97" text-anchor="end" letter-spacing="0.5">••••4242</text>
  <use href="#more" x="808" y="186" width="16" height="16"/>
  <text x="308" y="217" font-size="11" fill="#6B7078">On 3 machines · Replaced 2 d ago · Never used</text>
  <line x1="308" y1="232" x2="850" y2="232" stroke="#DDE1E6"/>

  <!-- Row 3: on one machine, with the hover -->
  <rect x="291" y="233" width="558" height="78" fill="#FFF7EE"/>
  <text x="308" y="258" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1C1D20">OPENAI_API_KEY</text>
  <text x="790" y="258" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8A8F97" text-anchor="end" letter-spacing="0.5">••••Zq9w</text>
  <use href="#more" x="808" y="246" width="16" height="16"/>
  <text x="308" y="277" font-size="11" fill="#6B7078">On 1 machine · Added 3 h ago · <tspan text-decoration="underline" text-decoration-style="dotted">Used 5 min ago</tspan></text>
  <use href="#warn" x="308" y="285" width="12" height="12"/>
  <text x="325" y="295" font-size="11" fill="#C2620A">Only on devbox. Not backed up: if devbox is lost, this secret is lost.</text>
  <line x1="308" y1="311" x2="850" y2="311" stroke="#DDE1E6"/>

  <!-- Row 4: a short value -->
  <text x="308" y="337" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1C1D20">NPM_PIN</text>
  <text x="790" y="337" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8A8F97" text-anchor="end" letter-spacing="0.5">••••</text>
  <use href="#more" x="808" y="325" width="16" height="16"/>
  <text x="308" y="356" font-size="11" fill="#6B7078">On 2 machines · Added 61 d ago · Used 12 d ago</text>
  <line x1="308" y1="371" x2="850" y2="371" stroke="#DDE1E6"/>

  <text x="308" y="396" font-size="13" fill="#1F5FC8">Add a Secret…</text>
  <line x1="308" y1="410" x2="850" y2="410" stroke="#DDE1E6"/>
  <text x="308" y="436" font-size="13" fill="#1F5FC8">Add a Card…</text>

  <text x="290" y="484" font-size="11" fill="#8A8F97">Sealed in this app to each machine of yours. The control plane never has a value.</text>

  <!-- For One Session -->
  <text x="290" y="520" font-size="11" font-weight="600" fill="#8A8F97">FOR ONE SESSION</text>
  <rect x="290" y="530" width="560" height="134" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="308" y="557" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1C1D20">SHOP_PASSWORD</text>
  <text x="572" y="557" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#8A8F97" letter-spacing="0.5">••••</text>
  <rect x="616" y="546" width="13" height="13" rx="3" fill="#fff" stroke="#B5BAC1"/>
  <text x="636" y="557" font-size="12" fill="#1C1D20">Ask before use</text>
  <rect x="752" y="545" width="80" height="20" rx="5" fill="#fff" stroke="#DDE1E6"/>
  <text x="792" y="559" font-size="12" fill="#D1342F" text-anchor="middle">Remove…</text>
  <text x="308" y="576" font-size="11" fill="#6B7078">Fix the shop sign-in · Added 1 h ago · Used 20 min ago</text>
  <use href="#warn" x="308" y="584" width="12" height="12"/>
  <text x="325" y="594" font-size="11" fill="#C2620A">Only on this Mac. Not backed up. It is deleted when the session is archived.</text>
  <line x1="308" y1="610" x2="850" y2="610" stroke="#DDE1E6"/>
  <text x="308" y="636" font-size="13" fill="#1F5FC8">Add for a Session…</text>

  <!-- The hover over "Used 5 min ago" -->
  <g filter="url(#shadow)">
    <rect x="470" y="302" width="356" height="62" rx="7" fill="#FFFFFF" stroke="#DDE1E6"/>
  </g>
  <text x="484" y="323" font-size="11" fill="#1C1D20">Used 8 Nov 2026, 16:42</text>
  <text x="484" y="340" font-size="11" fill="#6B7078">fill_secret on platform.openai.com</text>
  <text x="484" y="356" font-size="11" fill="#6B7078">by “Make the OpenAI key”, on devbox · Added 8 Nov, 13:50</text>
</svg>
