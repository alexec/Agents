name: Agents
options:
  bundleIdPrefix: com.alexecollins
  # This app runs on one Mac: Alex's, which is on 27.0. Nothing is stranded by
  # taking the current SDK, and the factory has no users to leave behind.
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6T4RVD5724
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode warns on every build without this. There are no user headers to search.
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  # This xcodegen install has no bundled setting presets, so the per-configuration
  # settings are spelled out. Without them DEBUG is never defined.
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
packages:
  AgentsKit:
    path: Packages/AgentsKit
  # The terminal emulator and its view. The app links this; agentsd does not,
  # because the daemon moves bytes and parses none of them.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  Agents:
    type: application
    supportedDestinations: [macOS]
    entitlements:
      path: App/Agents.entitlements
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AgentsKit
      - package: SwiftTerm
      # The helper goes in the bundle, so there is one thing to build, one thing to
      # sign, and nothing for anyone to install.
      - target: agentsd
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Alex Collins
        # Shown in the system's own alert, so written for the person reading it at
        # that moment. Both are asked for the first time dictation is used, never at
        # launch.
        NSMicrophoneUsageDescription: >-
          So you can say what you want done instead of typing it.
        NSSpeechRecognitionUsageDescription: >-
          So what you say becomes the words in the prompt. It is recognised on this Mac
          where this Mac can do it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents
        CODE_SIGN_ENTITLEMENTS: App/Agents.entitlements
        PRODUCT_NAME: Agents
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  # The remote: the same app, laid out for a phone and an iPad. It links
  # AgentsKitCore and nothing else, which is the rule that keeps a `Process` or a PTY
  # from ever reaching it — the compiler refuses before a reviewer has to.
  Remote:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Remote/Sources
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHumanReadableCopyright: © 2026 Alex Collins
        ITSAppUsesNonExemptEncryption: false
        # Scene-based from the first commit, because iOS 27 will not launch an app
        # without the UIScene lifecycle and nothing can be judged until it launches.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote
        PRODUCT_NAME: Agents
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  agentsd:
    type: tool
    supportedDestinations: [macOS]
    sources:
      - path: Daemon/Sources
    dependencies:
      - package: AgentsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.daemon
        PRODUCT_NAME: agentsd
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Remote:
    build:
      targets:
        Remote: all
    run:
      config: Debug
  Agents:
    build:
      targets:
        Agents: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # These also run with plain `swift test` from Packages/AgentsKit.
        - package: AgentsKit/AgentsKitTests
