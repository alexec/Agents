name: Agents
options:
  bundleIdPrefix: com.alexecollins
  # This app runs on one Mac: Alex's, which is on 27.0. Nothing is stranded by
  # taking the current SDK, and the factory has no users to leave behind.
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: 6T4RVD5724
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode warns on every build without this. There are no user headers to search.
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  # This xcodegen install has no bundled setting presets, so the per-configuration
  # settings are spelled out. Without them DEBUG is never defined.
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
packages:
  AgentsKit:
    path: Packages/AgentsKit
  # The terminal emulator and its view. The app links this; agentsd does not,
  # because the daemon moves bytes and parses none of them.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  # Code coloured and diffed (041). The two apps link this; agentsd does not, for the
  # same reason it has no SwiftTerm: the daemon moves text and reads none of it, and
  # the grammars are seventeen megabytes it has no use for.
  CodeText:
    path: Packages/CodeText
  # The control plane as a service (058): Agents Host carries its agents-control.
  ControlPlane:
    path: Packages/ControlPlane
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: 2.29.0
targets:
  # The Mac window (058, research R12): the App Store app, sandboxed, and linking
  # AgentsKitCore only, as the Remote does. It carries no helpers, no Linux programs and
  # no install scripts: Agents Host runs the agents, and the window reaches them through
  # the control plane. The developer window it was built beside went in T106.
  AgentsStore:
    type: application
    supportedDestinations: [macOS]
    # The sandbox gate (T044b): linking only Core stops a Process, not a read of the disk
    # or Finder pointed at a path. This does, before anything compiles.
    preBuildScripts:
      - name: Check the sandbox gate
        script: python3 "$SRCROOT/scripts/check-store-window.py"
        basedOnDependencyAnalysis: false
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - servers
          - toolsets
      # Compiled into the Remote as well. The two apps shared no view code before
      # this, which is how they came to draw the same state in three colours and the
      # same block kind at two sizes; the definitions both must agree on live here.
      - path: Shared/UI
      # Listed, not owned. An `entitlements:` key here would make XcodeGen the author
      # of the file and rewrite it from this one on every generate — and with nothing
      # under the key to write, what it writes is an empty plist. The project is not in
      # git and `xcodegen generate` is the first thing a fresh clone runs, so the day
      # the app needed a capability was the day that silently took it away again.
      # `CODE_SIGN_ENTITLEMENTS` below is what actually signs it in.
      - path: App/Agents-Store.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
      - package: SwiftTerm
      - package: CodeText
    info:
      path: App/Info-Store.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Alex Collins
        NSMicrophoneUsageDescription: >-
          So you can say what you want done instead of typing it.
        NSSpeechRecognitionUsageDescription: >-
          So what you say becomes the words in the prompt. It is recognised on this Mac
          where this Mac can do it.
        NSLocalNetworkUsageDescription: >-
          To find and reach your agents' control plane on this network.
        NSBonjourServices: [_agents-control._tcp]
        # Where "Set one up on this Mac" sends the person (frame K).
        AgentsHostDownloadURL: https://github.com/alexec/Agents/releases/latest
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.store
        CODE_SIGN_ENTITLEMENTS: App/Agents-Store.entitlements
        PRODUCT_NAME: Agents
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # The gate reads the sources, which a sandboxed script phase may not.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      # The App Store archive (058, T089, T093): Apple Distribution and the App Store profile
      # made for it, so the archive carries the entitlements an upload is checked against.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Agents Store App Store
  # The remote: the same app, laid out for a phone and an iPad. It links
  # AgentsKitCore and nothing else, which is the rule that keeps a `Process` or a PTY
  # from ever reaching it — the compiler refuses before a reviewer has to.
  Remote:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Remote/Sources
      - path: Remote/Resources
      # The same files the Mac compiles. See the note on the AgentsStore target.
      - path: Shared/UI
      # Listed, not owned. See the note on the AgentsStore target's entitlements.
      - path: Remote/Remote.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
      # The terminal's emulator and view (034). An emulator only: SwiftTerm's
      # `LocalProcess` half is macOS-only, so no process or PTY reaches the phone, and
      # the shell it draws is the one the Mac's daemon holds.
      - package: SwiftTerm
      - package: CodeText
      # The notification service extension: the banner's words are assembled on the
      # device, from a sealed push (021 T068).
      - target: RemoteNotify
      # The Home-screen widget (068). Same reason: it is not installed on its own, so it
      # ships inside this bundle and is versioned with it.
      - target: RemoteWidget
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHumanReadableCopyright: © 2026 Alex Collins
        ITSAppUsesNonExemptEncryption: false
        # The scheme the Home-screen widget links into (068). One scheme, two links: the
        # body of the widget and one of its rows.
        CFBundleURLTypes:
          - CFBundleURLName: com.alexecollins.agents.remote.widget
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - agents
        # Shown in the system's own alert the first time the app looks for the Mac.
        NSLocalNetworkUsageDescription: >-
          So this can find your Mac on the network you are both on, and show you what
          your agents are doing.
        NSBonjourServices:
          - _agents._tcp
        # Pairing: the camera reads the code the Mac shows in Settings ▸ Devices, once.
        NSCameraUsageDescription: >-
          To read the pairing code your Mac shows, so only your own phone or iPad can
          connect to it.
        # Dictation: the shared prompt asks for both when first used. Recognition runs
        # on the phone or iPad, so these descriptions are written for that device.
        NSMicrophoneUsageDescription: >-
          To hear what you say while you dictate into your prompt.
        NSSpeechRecognitionUsageDescription: >-
          To turn what you say into words for your prompt.
        # A silent push — a need moved elsewhere, or met — wakes the app to show or
        # remove its own banner (021 T079). Best effort by Apple's design.
        UIBackgroundModes:
          - remote-notification
        # Scene-based from the first commit, because iOS 27 will not launch an app
        # without the UIScene lifecycle and nothing can be judged until it launches.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote
        PRODUCT_NAME: Agents
        CODE_SIGN_ENTITLEMENTS: Remote/Remote.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        # Not the Mac's set: that mark stands on nothing, and iOS fills nothing with
        # black. This one is the crowd on its own dark ground, square, for iOS to round.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Mac's accent, so a link or a control is the same ink-blue on both.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      # The App Store archive (058, T089): production push and iCloud. Uploading is Alex's.
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Remote/Remote-AppStore.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Agents Remote App Store

  # Opens the sealed headline in a loud push and puts the words in the banner, on
  # the device (021 T068). Links AgentsKitCore only, as the Remote does.
  RemoteNotify:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: RemoteNotify/Sources
      - path: RemoteNotify/RemoteNotify.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
    info:
      path: RemoteNotify/Info.plist
      properties:
        CFBundleDisplayName: RemoteNotify
        CFBundleName: RemoteNotify
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote.notify
        PRODUCT_NAME: RemoteNotify
        CODE_SIGN_ENTITLEMENTS: RemoteNotify/RemoteNotify.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Agents Remote Notify App Store

  # The Home-screen widget (068). It shows the count of sessions that need a person, and
  # a tap on a row opens that conversation in the Remote. It links AgentsKitCore and
  # three of the shared views, and nothing else: a widget is handed a file and asked to
  # draw it, so anything that could reach the daemon or a PTY has no business here.
  # WidgetKit is loaded on demand and can be killed at any moment, so the provider reads
  # one small file and goes away again.
  RemoteWidget:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: RemoteWidget/Sources
      # The three shared files the drawn widget needs: the ground it is drawn on, the
      # app's one colour for a thing that needs a person, and the type scale. Not the
      # whole of Shared/UI, which is full of views that are about a conversation.
      - path: Shared/UI/Paper.swift
      - path: Shared/UI/StateTint.swift
      - path: Shared/UI/TypeScale.swift
      # Listed, not owned. See the note on the AgentsStore target's entitlements.
      - path: RemoteWidget/RemoteWidget.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
    info:
      path: RemoteWidget/Info.plist
      properties:
        CFBundleDisplayName: AgentsWidget
        CFBundleName: AgentsWidget
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # No principal class: WidgetKit finds the `@main` widget bundle itself, and
        # naming one here is the way to get a widget that installs and never draws.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote.widget
        # The extension's own name has to differ from the app it lives in, and the
        # display name is what the Home screen shows under the widget in the gallery.
        PRODUCT_NAME: AgentsWidget
        CODE_SIGN_ENTITLEMENTS: RemoteWidget/RemoteWidget.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # Refuses the app-only API a widget extension is not allowed to call, so one
        # cannot be written into this target by accident.
        APPLICATION_EXTENSION_API_ONLY: YES

  # agents-relay (058, T096): the bridge's relay and mailbox, cut down to a helper of
  # Agents Host that carries devices to the control plane through iCloud. Signed as the
  # bridge was, with its iCloud container (Alex's choice: nothing new in the developer
  # account).
  agents-relay:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Host/Relay/Sources
      - path: Host/Relay/agents-relay.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
    info:
      path: Host/Relay/Info.plist
      properties:
        CFBundleName: agents-relay
        CFBundleDisplayName: Agents Relay
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSBackgroundOnly: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.bridge
        PRODUCT_NAME: agents-relay
        CODE_SIGN_ENTITLEMENTS: Host/Relay/agents-relay.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES

  # Agents Host (058, US2, T054): the download of its own that runs this Mac's host and,
  # when chosen, the control plane's single copy, as launch agents. Not sandboxed and not
  # in the App Store, because it runs programs for the person's agents; Developer ID for
  # a release. Its window is frame L.
  AgentsHost:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Host/Sources
      # The pairing sheet's QR code, drawn as the window draws it.
      - path: App/Sources/Settings/QRCode.swift
      - path: Host/AgentsHost.entitlements
        buildPhase: none
      # The two launch agents Run it here registers (T055). SMAppService reads them from
      # here and nowhere else.
      - path: Host/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # What this Mac's host gives a server and downloads for a runtime (037, 048):
      # scripts/build-linux-agentsd.sh and scripts/update-toolset.sh write them here.
      - path: App/Resources/servers
        type: folder
        optional: true
      - path: App/Resources/toolsets
        type: folder
      # The web remote (071), built and checked in: copied as it is, so building Agents Host
      # needs no Node. agents-control serves only what its MANIFEST lists.
      - path: Web/dist
        type: folder
    dependencies:
      - package: AgentsKit
        product: AgentsKit
      - package: AgentsKit
        product: AgentsKitCore
      - target: agentsd
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: agents-control
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: agents-relay
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Agents Host
        CFBundleName: Agents Host
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Alex Collins
        # A menu bar item and one window; no Dock tile.
        LSUIElement: true
        # agents-host://pair: the App Store window's K2 asks for a code to be shown.
        CFBundleURLTypes:
          - CFBundleURLName: com.alexecollins.agents.host
            CFBundleURLSchemes: [agents-host]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.host
        CODE_SIGN_ENTITLEMENTS: Host/AgentsHost.entitlements
        PRODUCT_NAME: Agents Host
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES

  # The control plane's program (058), built here for Agents Host's bundle; Linux builds it
  # with `swift build` in Packages/ControlPlane.
  agents-control:
    type: tool
    supportedDestinations: [macOS]
    sources:
      - path: Packages/ControlPlane/Sources/agents-control
    dependencies:
      - package: ControlPlane
        product: ControlPlaneKit
      - package: AgentsKit
        product: AgentsKitCore
      - package: swift-nio-ssl
        product: NIOSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.control
        PRODUCT_NAME: agents-control
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  agentsd:
    type: tool
    supportedDestinations: [macOS]
    sources:
      - path: Daemon/Sources
    dependencies:
      - package: AgentsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.daemon
        PRODUCT_NAME: agentsd
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  AgentsHost:
    build:
      targets:
        AgentsHost: all
    run:
      config: Debug
  AgentsStore:
    build:
      targets:
        AgentsStore: all
    run:
      config: Debug
    # The Mac App Store archive (058, T089), checked by scripts/check-store-archive.sh.
    archive:
      config: Release
  agents-relay:
    build:
      targets:
        agents-relay: all
    run:
      config: Debug
  Remote:
    build:
      targets:
        Remote: all
    run:
      config: Debug
    archive:
      config: Release
  # On its own, for a widget that will not install and no error worth reading in the
  # Remote's own build log (068).
  RemoteWidget:
    build:
      targets:
        RemoteWidget: all
    run:
      config: Debug
