name: Agents
options:
  bundleIdPrefix: com.alexecollins
  # This app runs on one Mac: Alex's, which is on 27.0. Nothing is stranded by
  # taking the current SDK, and the factory has no users to leave behind.
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6T4RVD5724
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode warns on every build without this. There are no user headers to search.
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  # This xcodegen install has no bundled setting presets, so the per-configuration
  # settings are spelled out. Without them DEBUG is never defined.
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
packages:
  AgentsKit:
    path: Packages/AgentsKit
  # The terminal emulator and its view. The app links this; agentsd does not,
  # because the daemon moves bytes and parses none of them.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  Agents:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - servers
      # The Linux agentsd a server is given (037), built by
      # scripts/build-linux-agentsd.sh. A folder, so it lands as Resources/servers/ and
      # not loose; optional, because it is a build output and not in git.
      - path: App/Resources/servers
        type: folder
        optional: true
      # Compiled into the Remote as well. The two apps shared no view code before
      # this, which is how they came to draw the same state in three colours and the
      # same block kind at two sizes; the definitions both must agree on live here.
      - path: Shared/UI
      # Listed, not owned. An `entitlements:` key here would make XcodeGen the author
      # of the file and rewrite it from this one on every generate — and with nothing
      # under the key to write, what it writes is an empty plist. The project is not in
      # git and `xcodegen generate` is the first thing a fresh clone runs, so the day
      # the app needed a capability was the day that silently took it away again.
      # `CODE_SIGN_ENTITLEMENTS` below is what actually signs it in.
      - path: App/Agents.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
      - package: SwiftTerm
      # The helper goes in the bundle, so there is one thing to build, one thing to
      # sign, and nothing for anyone to install.
      - target: agentsd
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Alex Collins
        # Shown in the system's own alert, so written for the person reading it at
        # that moment. Both are asked for the first time dictation is used, never at
        # launch.
        NSMicrophoneUsageDescription: >-
          So you can say what you want done instead of typing it.
        NSSpeechRecognitionUsageDescription: >-
          So what you say becomes the words in the prompt. It is recognised on this Mac
          where this Mac can do it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents
        CODE_SIGN_ENTITLEMENTS: App/Agents.entitlements
        PRODUCT_NAME: Agents
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  # The remote: the same app, laid out for a phone and an iPad. It links
  # AgentsKitCore and nothing else, which is the rule that keeps a `Process` or a PTY
  # from ever reaching it — the compiler refuses before a reviewer has to.
  Remote:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Remote/Sources
      - path: Remote/Resources
      # The same files the Mac compiles. See the note on the Agents target.
      - path: Shared/UI
      # Listed, not owned. See the note on the Agents target's entitlements.
      - path: Remote/Remote.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
      # The terminal's emulator and view (034). An emulator only: SwiftTerm's
      # `LocalProcess` half is macOS-only, so no process or PTY reaches the phone, and
      # the shell it draws is the one the Mac's daemon holds.
      - package: SwiftTerm
      # The notification service extension: the banner's words are assembled on the
      # device, from a sealed push (021 T068).
      - target: RemoteNotify
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleName: Agents
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHumanReadableCopyright: © 2026 Alex Collins
        ITSAppUsesNonExemptEncryption: false
        # Shown in the system's own alert the first time the app looks for the Mac.
        NSLocalNetworkUsageDescription: >-
          So this can find your Mac on the network you are both on, and show you what
          your agents are doing.
        NSBonjourServices:
          - _agents._tcp
        # A silent push — a need moved elsewhere, or met — wakes the app to show or
        # remove its own banner (021 T079). Best effort by Apple's design.
        UIBackgroundModes:
          - remote-notification
        # Scene-based from the first commit, because iOS 27 will not launch an app
        # without the UIScene lifecycle and nothing can be judged until it launches.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote
        PRODUCT_NAME: Agents
        CODE_SIGN_ENTITLEMENTS: Remote/Remote.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        # Not the Mac's set: that mark stands on nothing, and iOS fills nothing with
        # black. This one is the crowd on its own dark ground, square, for iOS to round.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  # Opens the sealed headline in a loud push and puts the words in the banner, on
  # the device (021 T068). Links AgentsKitCore only, as the Remote does.
  RemoteNotify:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: RemoteNotify/Sources
      - path: RemoteNotify/RemoteNotify.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
        product: AgentsKitCore
    info:
      path: RemoteNotify/Info.plist
      properties:
        CFBundleDisplayName: RemoteNotify
        CFBundleName: RemoteNotify
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.remote.notify
        PRODUCT_NAME: RemoteNotify
        CODE_SIGN_ENTITLEMENTS: RemoteNotify/RemoteNotify.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The Mac end of the direct connection: a door onto the daemon for a device on the
  # same network. Started by hand — it has no pairing and no encryption yet.
  # The bridge is an *app-like bundle*, not a tool, and that is 021's T056 (005's T002):
  # only a bundle with an embedded provisioning profile can hold the iCloud
  # entitlement, and the daemon must not — `agentsd` gains no network code. The
  # bundle has no principal class, storyboard or delegate; `main.swift` is the whole
  # program, exactly as it was when this was a `tool`. Per Apple DTS.
  agents-bridge:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Bridge/Sources
      # Listed, not owned, for the reason given on the Agents target's entitlements.
      - path: Bridge/agents-bridge.entitlements
        buildPhase: none
    dependencies:
      - package: AgentsKit
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleName: agents-bridge
        CFBundleDisplayName: Agents Bridge
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # No Dock tile and no menu bar: nothing here is a window.
        LSUIElement: true
        LSBackgroundOnly: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.bridge
        PRODUCT_NAME: agents-bridge
        CODE_SIGN_ENTITLEMENTS: Bridge/agents-bridge.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES

  agentsd:
    type: tool
    supportedDestinations: [macOS]
    sources:
      - path: Daemon/Sources
    dependencies:
      - package: AgentsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.agents.daemon
        PRODUCT_NAME: agentsd
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  agents-bridge:
    build:
      targets:
        agents-bridge: all
    run:
      config: Debug
  Remote:
    build:
      targets:
        Remote: all
    run:
      config: Debug
  Agents:
    build:
      targets:
        Agents: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # These also run with plain `swift test` from Packages/AgentsKit.
        - package: AgentsKit/AgentsKitTests
