<!doctype html>
<html><head><meta charset="utf-8"><title>Pull request</title>
<!-- The github server's pull request page (ui://github/pr, #1341): show_pull_request's result.
     It has no network: it speaks only the MCP Apps bridge. -->
<style>
/*common.css*/
/*prpage.css*/
</style></head>
<body><main><div id="page"><div class="muted">Waiting for the host…</div></div></main>
<script>
/*bridge.js*/
/*labels.js*/
/*lineage.js*/
/*prpage.js*/
(() => {
  let repo = "";
  const say = (text, isError) => document.getElementById("page").replaceChildren(
    Object.assign(document.createElement("div"), { className: isError ? "error" : "muted", textContent: text }));
  const ui = bridge("github-pr", {
    input: (args) => { repo = args.repo || ""; say(args.number ? `Loading #${args.number}…` : "Loading…"); },
    result: (result) => page.draw(result),
    cancelled: (why) => say("Cancelled: " + why, true),
    started: () => say("Waiting for the pull request…"),
  });
  const page = prPage(ui, () => repo, null);
  ui.start();
})();
</script>
</body></html>
