# Deploys the service to Cloud Run on each version tag (v1.2.0). The `production` environment
# holds it until one of its required reviewers approves it.
#
# It signs in to Google Cloud with Workload Identity Federation: no key, only two repository
# variables, which setup-gcp.sh prints:
#   GCP_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOY_SA      deploy@<project>.iam.gserviceaccount.com
# and, optionally, SENTRY_DSN: where the service sends errors.
name: deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy

env:
  REGION: __GCP_REGION__
  SERVICE: __SERVICE__

jobs:
  cloud-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: The Google Cloud variables are there
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [[ -z $GCP_WIF_PROVIDER || -z $GCP_DEPLOY_SA ]]; then
            echo "::error::Set the variables GCP_WIF_PROVIDER and GCP_DEPLOY_SA: run setup-gcp.sh in Cloud Shell. Nothing was deployed."
            exit 1
          fi
          # The project is the one in the service account's address.
          project=${GCP_DEPLOY_SA#*@}
          echo "PROJECT=${project%%.*}" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          TAG: ${{ github.ref_name }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --source . --revision-suffix "${{ github.run_number }}" --allow-unauthenticated \
            --set-env-vars "SENTRY_DSN=$SENTRY_DSN,SENTRY_RELEASE=$SERVICE@${TAG#v}" --quiet

      # What this run deployed: cloudrun:<project>/<region>/<service>/<revision>. Agents reads the
      # notice from the run and shows the revision beside the release it came from.
      - name: Say the deploy
        run: echo "::notice title=deploy::cloudrun:$PROJECT/$REGION/$SERVICE/$SERVICE-${{ github.run_number }}"
