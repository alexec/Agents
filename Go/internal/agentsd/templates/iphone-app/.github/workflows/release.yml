# Uploads a build to TestFlight on each version tag (v1.2.0). The `testflight` environment
# holds it until one of its required reviewers approves it.
#
# Signing is Xcode's cloud-managed signing: xcodebuild -allowProvisioningUpdates with the App
# Store Connect API key, so Apple makes the certificate and the profile, and there is no .p12
# and no profile to keep. It needs, in the repository's settings:
#   secrets    ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID   the App Store Connect team key
#   variables  APPLE_TEAM_ID                           the team that signs
#              SENTRY_DSN                              where the app sends crashes (optional)
#              SENTRY_PROJECT                          the Sentry project's slug (optional)
#   secret     SENTRY_AUTH_TOKEN                       a Sentry organization token, to upload the
#                                                      debug symbols (optional)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUNDLE_ID: __BUNDLE_ID__
  XCODEGEN: 2.46.0
  SENTRY_CLI: 3.8.2

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@v5

      - name: The App Store Connect key is there
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z $ASC_KEY_P8 || -z $ASC_KEY_ID || -z $ASC_ISSUER_ID || -z $APPLE_TEAM_ID ]]; then
            echo "::error::Set the secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID and the variable APPLE_TEAM_ID. Nothing was uploaded."
            exit 1
          fi
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"

      - name: Make the Xcode project
        run: |
          curl -sSfL "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          TAG: ${{ github.ref_name }}
        run: |
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" SENTRY_DSN="$SENTRY_DSN"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # What this run deployed: testflight:<bundle id>/<build>. Agents reads the notice from the
      # run and shows the build beside the release it came from.
      - name: Say the deploy
        run: echo "::notice title=deploy::testflight:$BUNDLE_ID/${{ github.run_number }}"

      # The debug symbols, so that Sentry shows each crash's stack with names and lines. Only
      # with the SENTRY_AUTH_TOKEN secret and the SENTRY_PROJECT variable: without them, crashes
      # still reach Sentry, with addresses in place of names. The build is out already, so a
      # failure here does not fail the release.
      - name: Upload the debug symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -z $SENTRY_AUTH_TOKEN || -z $SENTRY_PROJECT ]]; then
            echo "No SENTRY_AUTH_TOKEN secret or SENTRY_PROJECT variable: no debug symbols were uploaded."
            exit 0
          fi
          curl -sSfL "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI/sentry-cli-Darwin-universal" -o "$RUNNER_TEMP/sentry-cli"
          chmod +x "$RUNNER_TEMP/sentry-cli"
          # An organization token names its organization, so only the project is given.
          "$RUNNER_TEMP/sentry-cli" debug-files upload --project "$SENTRY_PROJECT" "$RUNNER_TEMP/App.xcarchive/dSYMs"
