# Submits a release to App Review when a person approves it. On each version tag, the submit job
# waits at the `app-store` environment's gate for one of its required reviewers. Only after
# Approve does it wait for release.yml's TestFlight build of the tag to be processed, then submit
# it (scripts/asc.swift). Reject ends it, and the release stays on TestFlight.
#
# The gate job first checks that the `app-store` environment has required reviewers. Without
# them the submit job does not start: GitHub would make the environment with no gate, and the
# release would go to App Review with nobody's approval.
#
# It needs the secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID, as release.yml does.
name: app-store

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.ref_name }}

env:
  BUNDLE_ID: __BUNDLE_ID__
  TAG: ${{ github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: The app-store environment has required reviewers
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/app-store" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]] | length' 2>/dev/null || echo 0)
          if [[ $reviewers -gt 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app-store environment with required reviewers, so $TAG is not submitted to App Review."
          fi

  submit:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: app-store
    steps:
      - uses: actions/checkout@v5

      - name: The App Store Connect key is there
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ -z $ASC_KEY_P8 || -z $ASC_KEY_ID || -z $ASC_ISSUER_ID ]]; then
            echo "::error::Set the secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID. Nothing was submitted to App Review."
            exit 1
          fi
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"

      # "What's New" is the tag's message.
      - name: Submit for App Review
        id: submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          export WHATS_NEW="$(git tag -l --format='%(contents)' "$TAG")"
          swift scripts/asc.swift submit "${TAG#v}" --wait 110 | tee "$RUNNER_TEMP/submit.log"
          echo "build=$(tail -n 1 "$RUNNER_TEMP/submit.log")" >> "$GITHUB_OUTPUT"

      # What this run deployed: the App Store version, and the TestFlight build it submitted.
      - name: Say the deploy
        run: |
          echo "::notice title=deploy::testflight:$BUNDLE_ID/${{ steps.submit.outputs.build }}"
          echo "::notice title=deploy::appstore:$BUNDLE_ID/${TAG#v}"
