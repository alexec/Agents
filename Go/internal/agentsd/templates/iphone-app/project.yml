# The Xcode project, made by XcodeGen (https://github.com/yonaskolb/XcodeGen): run
# `xcodegen generate`, then open App.xcodeproj. The workflows make it the same way.
name: App
options:
  bundleIdPrefix: __BUNDLE_ID__
  deploymentTarget:
    iOS: "18.0"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.33.0
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The workflows set these: the team from the APPLE_TEAM_ID variable, and the DSN from
    # the SENTRY_DSN variable. With no DSN, the app sends nothing to Sentry.
    DEVELOPMENT_TEAM: ""
    SENTRY_DSN: ""
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Sentry
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: __APP_NAME__
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SentryDSN: $(SENTRY_DSN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        PRODUCT_NAME: App
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"
