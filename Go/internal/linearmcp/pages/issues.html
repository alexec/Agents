<!doctype html>
<html><head><meta charset="utf-8"><title>Linear issues</title>
<!-- The linear server's Issues (ui://linear/issues, #1343): show_issues's result, the same
     shape as the github server's Issues page. A team, a state or a label narrows it. Start
     Agent opens the app's new-agent form filled in for the issue (agents/start-agent, #834).
     It has no network: it speaks only the MCP Apps bridge. -->
<style>
/*common.css*/
.start { grid-column: 3; grid-row: 1 / span 2; white-space: nowrap; }
.meta { grid-column: 2; }
select { font: inherit; }
.label-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
.label-filters input { min-width: 12em; }
</style></head>
<body><main>
  <header><h1>Linear issues</h1>
    <select id="team" title="Team" disabled><option value="">Every team</option></select>
    <select id="state" title="State" disabled><option value="">Every open state</option></select>
    <span class="grow"></span>
    <button id="refresh" type="button" disabled>Refresh</button></header>
  <div class="label-filters" role="group" aria-label="Filter issues by labels">
    <span class="muted">Labels</span><span id="label-tags"></span>
    <input id="label-input" type="text" aria-label="Add a label filter" placeholder="Add label filter" list="label-options" autocomplete="off">
    <datalist id="label-options"></datalist>
  </div>
  <div id="state-line" class="muted">Waiting for the host…</div>
  <ul id="issues"></ul>
</main>
<script>
/*bridge.js*/
(() => {
  let team = "", state = "", labels = [];
  const ui = bridge("linear-issues", {
    input: (args) => { team = args.team || ""; state = args.state || ""; labels = args.label ? [args.label] : []; drawLabel(); say("Listing…"); },
    result: (result) => draw(result),
    cancelled: (why) => say("Cancelled: " + why, true),
    started: () => say("Waiting for the issues…"),
  });
  const { $, el, link, button } = ui;
  const say = (text, isError) => { $("state-line").textContent = text; $("state-line").className = isError ? "error" : "muted"; ui.size(); };
  // Linear's state types, in words.
  const stateWords = { triage: "Triage", backlog: "Backlog", unstarted: "To do", started: "In progress" };

  const fill = (select, first, options, chosen) => {
    select.replaceChildren(el("option", { value: "", textContent: first }),
      ...options.map(([value, text]) => el("option", { value, textContent: text, selected: value === chosen })));
    select.disabled = false;
  };

  const drawLabel = () => {
    $("label-tags").replaceChildren(...labels.map((name) => button(name + " ✕", () => choose({ removeLabel: name }), { className: "pill chosen", title: `Remove ${name} label filter` })));
  };

  const draw = (result) => {
    const found = ui.data(result);
    if (!found) { say("Couldn't list Linear issues: " + ui.errorText(result), true); $("refresh").disabled = false; return; }
    const issues = Array.isArray(found.issues) ? found.issues : [];
    const options = [...new Set(issues.flatMap((issue) => issue.labels || []))].filter((name) => !labels.includes(name));
    $("label-options").replaceChildren(...options.map((name) => el("option", { value: name })));
    fill($("team"), "Every team", (found.teams || []).map((t) => [t.key, `${t.name} (${t.key})`]), team);
    fill($("state"), "Every open state", (found.states || []).map((s) => [s, stateWords[s] || s]), state);
    $("issues").replaceChildren(...issues.map(row));
    drawLabel();
    const started = issues.filter((issue) => issue.stateType === "started").length;
    say(issues.length ? `${issues.length} open · ${started} in progress · as of ${new Date().toLocaleTimeString()}`
      : labels.length ? `No open issues labelled ${labels.join(" and ")}.` : "No open issues.");
    $("refresh").disabled = false;
  };

  const row = (issue) => {
    const issueLabels = (issue.labels || []).map((name) => button(name, () => choose({ addLabel: name }),
      { className: labels.includes(name) ? "pill chosen" : "pill", title: "Filter by label " + name }));
    const assignee = issue.assignee
      ? el("span", { className: "pill assigned", textContent: issue.assignee, title: "Assigned to " + issue.assignee }) : null;
    const comments = issue.comments ? ` · ${issue.comments} comment${issue.comments === 1 ? "" : "s"}` : "";
    const priority = issue.priority ? ` · ${issue.priority}` : "";
    const start = button("Start Agent", () => startAgent(issue),
      { className: "start", title: `A new agent for ${issue.identifier}, in a worktree of its own` });
    return el("li", {}, [
      link(issue.identifier, issue.url),
      el("span", { className: "title", textContent: issue.title, title: issue.title }),
      start,
      el("span", { className: "meta" }, [
        el("span", { className: "pill", textContent: issue.state || stateWords[issue.stateType] || "" }),
        assignee,
        el("span", { textContent: `${issue.author || "someone"}${priority}${comments}${issue.updatedAt ? " · " + ui.ago(issue.updatedAt) : ""}` }),
        ...issueLabels,
      ]),
    ]);
  };

  // The app's new-agent form, filled in for this issue (#834). The person starts it, or not.
  // The identifier in the branch and the pull request's title is how Linear links them.
  const startAgent = async (issue) => {
    const id = issue.identifier;
    const prompt = `Work on Linear issue ${id}: ${issue.title}\n${issue.url}\n\n`
      + `Read it with Linear's MCP server (mcp.linear.app). First assign it to yourself and move it to In Progress. `
      + `Put ${id} in the branch name and in the pull request's title, so Linear links the pull request to the issue.`;
    try {
      await ui.request("agents/start-agent", { prompt, labels: [id], worktree: `${id} ${issue.title}` });
      say(`A new agent for ${id} is ready to start.`);
    } catch (e) { say("Couldn't open a new agent: " + e.message, true); ui.log("start-agent refused: " + e.message, "warning"); }
  };

  const list = async () => {
    $("refresh").disabled = true;
    const args = {};
    if (team) args.team = team;
    if (state) args.state = state;
    try {
      const results = await Promise.all((labels.length ? labels : [""]).map((name) => ui.call("show_issues", name ? { ...args, label: name } : args)));
      const first = results[0];
      const common = labels.length > 1 ? results.slice(1).reduce((items, result) => {
        const ids = new Set((result.issues || []).map((issue) => issue.identifier));
        return items.filter((issue) => ids.has(issue.identifier));
      }, first.issues || []) : first.issues || [];
      draw({ structuredContent: { ...first, issues: common } });
    }
    catch (e) { say("Couldn't list Linear issues: " + e.message, true); $("refresh").disabled = false; }
  };
  const choose = (change) => {
    if ("team" in change) team = change.team;
    if ("state" in change) state = change.state;
    if ("addLabel" in change && change.addLabel && !labels.includes(change.addLabel)) labels = [...labels, change.addLabel];
    if ("removeLabel" in change) labels = labels.filter((item) => item !== change.removeLabel);
    drawLabel(); say("Listing…"); list();
  };
  const labelInput = $("label-input");
  const addTypedLabel = () => { const name = labelInput.value.trim().replace(/,$/, ""); if (name) { labelInput.value = ""; choose({ addLabel: name }); } };
  labelInput.onkeydown = (event) => { if (event.key === "Enter" || event.key === ",") { event.preventDefault(); addTypedLabel(); } };
  labelInput.onchange = addTypedLabel;
  labelInput.onblur = addTypedLabel;
  $("team").onchange = () => choose({ team: $("team").value });
  $("state").onchange = () => choose({ state: $("state").value });
  $("refresh").onclick = list;
  ui.start();
})();
</script>
</body></html>
