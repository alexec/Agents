# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml. Wall-clock budgets
# are `.perfBudget` (PerfBudget.swift): checked everywhere, but the budget is held only by
# scripts/perf-tests.sh, slow-tests.yml's perf-tests job (#225).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which macOS jobs this run needs (#594), on a runner that is never short. Most of a
  # pull request's time to land was spent queued for a macOS runner, not building: in
  # October 2026 `test` waited 3–31 minutes and `packages` 8–36 to run for a few seconds
  # with nothing selected. A job skipped by its `if:` still satisfies a required check,
  # so `packages` and `test` start only when there is work for them. The jobs' own
  # selection steps still choose the suites; this only decides whether they start, and
  # if it fails they start anyway.
  #
  # On a push to main it waits first (#595): every merge starts a run, the next merge
  # cancels it (the concurrency group above), and each cancelled run used to hold two
  # macOS runners until then. Waiting here lets a burst of merges cancel each other on
  # this runner, so only the last takes macOS runners.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.test-selection.outputs.apps }}
      packages: ${{ steps.test-selection.outputs.packages }}
      mcpservers: ${{ steps.test-selection.outputs.mcpservers }}
      linux: ${{ steps.test-selection.outputs.linux }}
      go: ${{ steps.test-selection.outputs.go }}
    steps:
      - name: Let a burst of merges settle
        if: github.event_name == 'push'
        run: sleep 300

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: select
    # `always()` so a failed `select` still runs this job rather than skipping it, which
    # would read as a pass.
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.apps != 'skip') }}
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    # Long enough for the two builds, CodeText and the whole AgentsKit suite. It was
    # ten minutes, and a run the selector chose as `full` takes longer than that on this
    # runner: the job was cancelled at the cap with every test before it passing, on
    # main as well as on a branch (run 36642820605). The selection is what keeps this
    # small; the cap has to fit the run it lets through. "Time left for the AgentsKit
    # tests" below reads the same number as JOB_MINUTES; change both together.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # For the AgentsKit tests' budget below.
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # The selector compares against the PR base or the previous push.
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes
      # absolute SDK and framework paths into the objects it produces, and the runner's
      # Xcode moves under it: an image update left every restored cache pointing at an
      # SDK that was no longer there, the objects were considered up to date, and the
      # link failed with every AgentsKitCore symbol undefined. This is part of every
      # cache key below, so a new image is a miss — a cold build that works — rather
      # than a restore nobody can use. Both facts come from the image and are true
      # before anything is restored, which is why this runs here and not in Tools.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"

      # The Xcode and SwiftPM keys end in a hash of the sources their builds read (#269).
      # They used to hash only project.yml and the package manifests, so a change to the
      # sources still found an exact key: the old build was restored, the save after it
      # was skipped as a hit, and every run built on that one stale graph until someone
      # deleted the cache by hand. Now new sources miss their exact key, start warm from
      # the nearest restore-key, and save a key of their own. `git ls-tree` names each
      # folder by its tree hash, so this costs nothing and changes exactly when a file
      # under one of them does. (AgentsKit's key already hashes its sources.)
      - name: Cache keys
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Daemon Host Packages Remote RemoteNotify RemoteWidget Shared Web | git hash-object --stdin)"
          swiftpm="$(git ls-tree HEAD -- Daemon Packages/AgentsKit Packages/CodeText | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          echo "swiftpm=${swiftpm}" >> "$GITHUB_OUTPUT"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          echo "agentskit=${agentskit}" >> "$GITHUB_OUTPUT"

      # Restore Xcode and SwiftPM products from separate caches. The Xcode cache
      # can be saved as soon as both app builds finish.
      #
      # Each falls back from its own key, to the newest built from the same manifests,
      # to the newest of its kind for this toolchain. Partial builds are never restored:
      # a cancelled run can leave a large, unusable cache. There is deliberately no key
      # that ignores the fingerprint: that let a graph from the old image be restored
      # under a new one.
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}
          restore-keys: |
            macos-xcode-27-derived-${{ steps.keys.outputs.base }}-
            macos-xcode-27-derived-${{ steps.toolchain.outputs.fingerprint }}-

      # A graph restored from another tree can hold an AgentsKit that Xcode will not
      # rebuild: on 2026-10-11 three pull requests (#679, #681, #683) restored main's older
      # DerivedData, the Swift driver compiled none of AgentsKitCore's changed sources,
      # AgentsStore failed against the old module, and the clean retry below cost 6–9
      # minutes each. The save records which AgentsKit sources the graph was built from;
      # when they differ, only AgentsKit's own objects go, and the rest stays warm.
      - name: Drop a stale AgentsKit from the Xcode build cache
        if: steps.xcode-cache.outputs.cache-matched-key != '' && steps.xcode-cache.outputs.cache-hit != 'true'
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: |
          built="$(cat build/DD/agentskit-sources 2>/dev/null || true)"
          if [[ "$built" != "$AGENTSKIT" ]]; then
            echo "AgentsKit sources differ from the restored graph's (${built:-unrecorded}); dropping its objects."
            rm -rf build/DD/Build/Intermediates.noindex/AgentsKit.build
            find build/DD/Build/Products -maxdepth 2 -name 'AgentsKit*' -exec rm -rf {} +
          fi

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}
          restore-keys: |
            macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-
            macos-xcode-27-swiftpm-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Restore AgentsKit build cache
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}
          restore-keys: |
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}-
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-

      # The same stale graph as the Xcode cache's above (#684), in SwiftPM's build: on
      # 2026-10-13 every pull request that changed AgentsKit (#882, #886, #887, #889)
      # restored an older .build, SwiftPM recompiled AgentsKit but not AgentsKitCore, the
      # link failed on undefined AgentsKitCore symbols, and the clean retry rebuilt the
      # dependencies too: 6–11 minutes for a step that takes under one when warm. The save
      # records which AgentsKit sources the graph was built from; when they differ, only the
      # package's own targets go, and swift-nio, swift-nio-ssl and SwiftTerm stay warm.
      - name: Drop a stale AgentsKit from the AgentsKit build cache
        if: steps.agentskit-cache.outputs.cache-matched-key != '' && steps.agentskit-cache.outputs.cache-hit != 'true'
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: bash scripts/drop-stale-agentskit.sh Packages/AgentsKit/.build "$AGENTSKIT"

      # agentsd links AgentsKit as a local package, so Daemon/.build holds the same stale
      # graph. On 2026-10-13 (#897) runs 38334579377 and 38343467490 restored it, the
      # agentsd link failed on undefined AgentsKitCore symbols, and the clean retry took
      # 4–6 minutes: with a slow test run after it, the job reached its 30-minute cap.
      - name: Drop a stale AgentsKit from the SwiftPM build cache
        if: steps.swiftpm-cache.outputs.cache-matched-key != '' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: bash scripts/drop-stale-agentskit.sh Daemon/.build "$AGENTSKIT"

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain,
      # and every absolute path of the Xcode and SDK that produced it. Rewrite the mount
      # when the component version matches; drop the graph when it names an Xcode or SDK
      # this runner does not have, which is what an image update looks like from here.
      - name: Normalize AgentsKit build cache
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build
      # Every build below that starts from a restored cache gets one more go from clean
      # when it fails (scripts/ci-clean-retry.sh says why). The step only fails, and so
      # is only kept from the cache, when the clean build fails as well.
      - name: Build AgentsKit tests
        id: build-agentskit
        if: steps.test-selection.outputs.agentskit != 'skip'
        env:
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/AgentsKit/.build -- \
            swift build --build-tests --package-path Packages/AgentsKit

      - name: Record the AgentsKit sources this build was made from
        if: ${{ always() && steps.agentskit-cache.outputs.cache-hit != 'true' && steps.build-agentskit.outcome == 'success' }}
        run: echo "${{ steps.keys.outputs.agentskit }}" > Packages/AgentsKit/.build/agentskit-sources

      # Only completed builds are saved. Cancellation must not persist a partial cache
      # that can fill runner disk or poison a later restore.
      - name: Save AgentsKit build cache
        if: ${{ always() && steps.agentskit-cache.outputs.cache-hit != 'true' && steps.build-agentskit.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}

      - name: Prune old AgentsKit caches for this ref
        if: ${{ always() && steps.build-agentskit.outcome == 'success' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-agentskit- 'macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}' "$GITHUB_REF"

      # Agents Host's build makes Web/dist, which is not checked in (#473), with the pinned
      # Node; without it the app would build with no web remote.
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version

      - name: Generate the project
        run: xcodegen generate

      # The Linux agentsd folder is a build output and gitignored, and the app copies
      # it. Empty is what a Mac without scripts/build-linux-agentsd.sh has.
      - name: Make room for the Linux agentsd
        run: mkdir -p App/Resources/servers

      # One scheme after the other, and with plug-in validation skipped: without it
      # SwiftTerm's plug-in fails and says nothing. No signing on a runner. Agents Host
      # carries agentsd and agents-control; the window is the App Store build.
      - name: Build Agents Host and the window (macOS)
        id: build-mac
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          build() {
            xcodebuild build -project Agents.xcodeproj -scheme AgentsHost \
              -destination 'platform=macOS' -derivedDataPath build/DD \
              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO &&
            xcodebuild build -project Agents.xcodeproj -scheme AgentsStore \
              -destination 'platform=macOS' -derivedDataPath build/DD \
              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
          }
          clean_retry "$RESTORED" build/DD -- build

      - name: Build Remote (iOS Simulator)
        id: build-remote
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" build/DD -- \
            xcodebuild build -project Agents.xcodeproj -scheme Remote \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      # Only when both app builds actually ran. They are skipped whenever an earlier
      # step fails, and a skipped step used to read as "not successful", so a job that
      # died long before them saved whatever DerivedData it happened to be holding.
      - name: Record the AgentsKit sources this graph was built from
        if: ${{ always() && steps.xcode-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' }}
        run: echo "${{ steps.keys.outputs.agentskit }}" > build/DD/agentskit-sources

      - name: Save Xcode build cache
        if: ${{ always() && steps.xcode-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}

      - name: Prune old Xcode caches for this ref
        if: ${{ always() && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' && steps.xcode-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-derived- 'macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}' "$GITHUB_REF"

      # ServerLinkTests runs this agentsd, and builds it itself when it is missing:
      # a whole Swift build inside the test run, holding a test thread for minutes,
      # which on a shared runner stalls everything else. Built here instead, and only
      # when the run includes a suite that reads it: a filtered run that names none of
      # them spent three to five minutes here on a binary nothing ran. The selector says
      # which suites those are. Skipping it also skips the SwiftPM cache save below,
      # which already waits on this build, so no partial cache is kept.
      - name: Build agentsd for the tests
        id: build-agentsd
        if: steps.test-selection.outputs.agentsd == 'build'
        env:
          RESTORED: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Daemon/.build -- \
            swift build --package-path Daemon --product agentsd

      # How long the runner's login shell takes to say its PATH. The app reads it
      # once per process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null

      # Build CodeText tests before execution so the cache can be saved before tests.
      - name: Build CodeText tests
        id: build-codetext
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          RESTORED: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/CodeText/.build -- \
            swift build --build-tests --package-path Packages/CodeText

      - name: Record the AgentsKit sources agentsd was built from
        if: ${{ always() && steps.test-selection.outputs.agentskit != 'skip' && steps.test-selection.outputs.codetext != 'skip' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.build-agentsd.outcome == 'success' && steps.build-codetext.outcome == 'success' }}
        run: echo "${{ steps.keys.outputs.agentskit }}" > Daemon/.build/agentskit-sources

      - name: Save SwiftPM build cache
        # This combined cache contains both paths below. Save it only when both
        # package builds ran, so a skipped package cannot produce a partial cache,
        # and never on a failure, for the reason above.
        if: ${{ always() && steps.test-selection.outputs.agentskit != 'skip' && steps.test-selection.outputs.codetext != 'skip' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.build-agentsd.outcome == 'success' && steps.build-codetext.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}

      - name: Prune old SwiftPM caches for this ref
        if: ${{ always() && steps.build-agentsd.outcome == 'success' && steps.build-codetext.outcome == 'success' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-swiftpm- 'macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}' "$GITHUB_REF"

      - name: Test CodeText
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.codetext_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.codetext }}
        run: |
          if [ "$TEST_MODE" = filter ]; then
            swift test --skip-build --package-path Packages/CodeText --filter "$TEST_FILTER"
          else
            swift test --skip-build --package-path Packages/CodeText
          fi

      # A job that reaches its timeout-minutes ends Cancelled, not Failed (#897): no
      # checks.failed, no red mark, and a pull request with auto-merge on waits for a
      # required check that will never come. A step's own timeout fails the step, so the
      # tests get what the job has left, less two minutes for the steps after them, and a
      # slow run ends red before the job's cap can cancel it.
      - name: Time left for the AgentsKit tests
        id: budget
        if: steps.test-selection.outputs.agentskit != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
        run: |
          left=$(( JOB_MINUTES - 2 - ($(date +%s) - START) / 60 ))
          (( left > 25 )) && left=25
          (( left < 1 )) && left=1
          echo "The AgentsKit tests have ${left} minutes."
          echo "minutes=${left}" >> "$GITHUB_OUTPUT"

      - name: Test AgentsKit
        if: steps.test-selection.outputs.agentskit != 'skip'
        # A filtered run is a few seconds and a full one is two to fourteen minutes, so
        # this is the full run's budget rather than the filtered one's: at most 25, and
        # never past the job's own cap (the step above).
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.agentskit_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.agentskit }}
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          run_agentskit_tests() {
            if [ "$TEST_MODE" = filter ]; then
              swift test --skip-build --package-path Packages/AgentsKit --filter "$TEST_FILTER"
            else
              swift test --skip-build --package-path Packages/AgentsKit
            fi
          }

          log="$RUNNER_TEMP/agentskit-tests.log"
          if run_agentskit_tests 2>&1 | tee "$log"; then
            exit 0
          else
            status=${PIPESTATUS[0]}
          fi
          if [ -z "$RESTORED" ]; then exit "$status"; fi

          if grep -Eq 'Undefined symbols for architecture|symbol\(s\) not found for architecture|AgentsKitCore.*undefined' "$log"; then
            echo "::warning::Stale AgentsKit link detected on a restored cache. Rebuilding and rerunning immediately from clean."
          else
            echo "::warning::AgentsKit tests failed on a restored build cache. Rebuilding and rerunning once from clean."
          fi
          rm -rf Packages/AgentsKit/.build
          swift build --build-tests --package-path Packages/AgentsKit
          run_agentskit_tests

  # The control plane's package, in a job of its own so it never presses on the test job's
  # time cap. ControlPlane links AgentsKit, so it runs on changes to either. (The web types'
  # freshness moved to the `go` job with Packages/Wire, #1135.)
  packages:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.packages != 'skip') }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      - name: Test ControlPlane
        if: steps.test-selection.outputs.controlplane != 'skip'
        timeout-minutes: 20
        run: swift test --package-path Packages/ControlPlane

  # The MCP servers Agents ships (#700), on Linux, where a cloud host runs them: no macOS
  # runner to wait for, and the same toolchain as the release's static Linux build. The
  # package depends on nothing else here, so it runs only when it changes.
  mcp-servers:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.mcpservers != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Test MCPServers
        run: swift test --package-path Packages/MCPServers

  # The Go module at Go/ (#1135): the daemon and the control plane as they move to Go
  # (#1134). Built, vetted and tested on Linux with the Go its go.mod names. Its wiregen test
  # holds Go/wire and Web/src/protocol/generated.ts to Packages/Wire, the wire's schema.
  go:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.go != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache-dependency-path: Go/go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # The Go agentsd on a Mac (#1138): the same module built and tested on macOS, so a
  # Mac-only path (its root, its folders, a *_darwin.go file) is held as Linux's is. TMPDIR
  # is resolved, because a Mac's temporary folder is reached through the /var link and the
  # daemon keeps folders with their links resolved, as the Swift one does.
  go-darwin:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.go != 'skip') }}
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache-dependency-path: Go/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P) go test ./...

  # The Linux hosts (#805): agentsd and ci-watcher, static, for x86_64 only, as
  # scripts/build-linux-agentsd.sh --check builds them before a ship. A Mac-only symbol
  # used from code Linux compiles, such as a member declared behind `canImport(CryptoKit)`,
  # passes every macOS job and broke this build twice in a day (#788, #799), found only when
  # shipping. One architecture is enough for that: the sources are the same for both. The
  # toolchain and SDK are the release workflow's linux job's; move them together. The build
  # is warm from main's newest cache, which only a push to main saves, so pull requests do
  # not fill the cache with one each.
  linux:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.linux != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v6

      - name: Tools and the Static Linux SDK
        run: |
          apt-get update -qq && apt-get install -y -qq zsh file >/dev/null
          swift sdk install \
            https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e

      # Taken before the build, as hashFiles over Daemon/** after it would read .build.
      - name: Cache key
        id: linux-keys
        env:
          RESOLVED: ${{ hashFiles('Daemon/Package.resolved', 'Packages/AgentsKit/Package.resolved') }}
          SOURCES: ${{ hashFiles('Daemon/**', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Sources/**', 'Packages/AgentsKit/Plugins/**', 'Packages/MCPServers/**') }}
        run: echo "key=linux-x86_64-swift-6.4.0-${RESOLVED}-${SOURCES}" >> "$GITHUB_OUTPUT"

      - name: Restore the Linux build cache
        id: linux-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            Daemon/.build
            Packages/MCPServers/.build
          key: ${{ steps.linux-keys.outputs.key }}
          restore-keys: |
            linux-x86_64-swift-6.4.0-${{ hashFiles('Daemon/Package.resolved', 'Packages/AgentsKit/Package.resolved') }}-
            linux-x86_64-swift-6.4.0-

      - name: Build agentsd and ci-watcher for Linux
        id: build-linux
        shell: bash
        env:
          SWIFT: swift
          RESTORED: ${{ steps.linux-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Daemon/.build Packages/MCPServers/.build -- \
            zsh scripts/build-linux-agentsd.sh --check x86_64

      - name: Save the Linux build cache
        if: ${{ github.event_name == 'push' && steps.linux-cache.outputs.cache-hit != 'true' && steps.build-linux.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            Daemon/.build
            Packages/MCPServers/.build
          key: ${{ steps.linux-keys.outputs.key }}

  # The web remote (071, D7, research R8): a build with the pinned Node, then tsc, the lint
  # that keeps agent output inert, the licence list and the web tests, which hold the build to
  # its MANIFEST. Web/dist is not checked in (#473), so there is no committed copy to compare.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test

  # Tests that index or force-unwrap after an #expect (#94): a failed check carries on, and
  # the trap after it ends the whole `swift test` run, so every later test goes unreported.
  # A text check, so it runs on every change and needs no Mac.
  test-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-test-indexing.py --selftest
      - run: python3 scripts/check-test-indexing.py
