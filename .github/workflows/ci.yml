# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml. Wall-clock budgets
# are `.perfBudget` (PerfBudget.swift): checked everywhere, but the budget is held only by
# scripts/perf-tests.sh, slow-tests.yml's perf-tests job (#225).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    # Long enough for the two builds, CodeText and the whole AgentsKit suite. It was
    # ten minutes, and a run the selector chose as `full` takes longer than that on this
    # runner: the job was cancelled at the cap with every test before it passing, on
    # main as well as on a branch (run 36642820605). The selection is what keeps this
    # small; the cap has to fit the run it lets through.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          # The selector compares against the PR base or the previous push.
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes
      # absolute SDK and framework paths into the objects it produces, and the runner's
      # Xcode moves under it: an image update left every restored cache pointing at an
      # SDK that was no longer there, the objects were considered up to date, and the
      # link failed with every AgentsKitCore symbol undefined. This is part of every
      # cache key below, so a new image is a miss — a cold build that works — rather
      # than a restore nobody can use. Both facts come from the image and are true
      # before anything is restored, which is why this runs here and not in Tools.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"

      # The Xcode and SwiftPM keys end in a hash of the sources their builds read (#269).
      # They used to hash only project.yml and the package manifests, so a change to the
      # sources still found an exact key: the old build was restored, the save after it
      # was skipped as a hit, and every run built on that one stale graph until someone
      # deleted the cache by hand. Now new sources miss their exact key, start warm from
      # the nearest restore-key, and save a key of their own. `git ls-tree` names each
      # folder by its tree hash, so this costs nothing and changes exactly when a file
      # under one of them does. (AgentsKit's key already hashes its sources.)
      - name: Cache keys
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Daemon Host Packages Remote RemoteNotify RemoteWidget Shared Web/dist | git hash-object --stdin)"
          swiftpm="$(git ls-tree HEAD -- Daemon Packages/AgentsKit Packages/CodeText | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          echo "swiftpm=${swiftpm}" >> "$GITHUB_OUTPUT"

      # Restore Xcode and SwiftPM products from separate caches. The Xcode cache
      # can be saved as soon as both app builds finish.
      #
      # Each falls back from its own key, to the newest built from the same manifests,
      # to the newest of its kind for this toolchain. Partial builds are never restored:
      # a cancelled run can leave a large, unusable cache. There is deliberately no key
      # that ignores the fingerprint: that let a graph from the old image be restored
      # under a new one.
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}
          restore-keys: |
            macos-xcode-27-derived-${{ steps.keys.outputs.base }}-
            macos-xcode-27-derived-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}
          restore-keys: |
            macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-
            macos-xcode-27-swiftpm-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Restore AgentsKit build cache
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}
          restore-keys: |
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}-
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain,
      # and every absolute path of the Xcode and SDK that produced it. Rewrite the mount
      # when the component version matches; drop the graph when it names an Xcode or SDK
      # this runner does not have, which is what an image update looks like from here.
      - name: Normalize AgentsKit build cache
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build
      # Every build below that starts from a restored cache gets one more go from clean
      # when it fails (scripts/ci-clean-retry.sh says why). The step only fails, and so
      # is only kept from the cache, when the clean build fails as well.
      - name: Build AgentsKit tests
        id: build-agentskit
        if: steps.test-selection.outputs.agentskit != 'skip'
        env:
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/AgentsKit/.build -- \
            swift build --build-tests --package-path Packages/AgentsKit

      # Only completed builds are saved. Cancellation must not persist a partial cache
      # that can fill runner disk or poison a later restore.
      - name: Save AgentsKit build cache
        if: ${{ always() && steps.agentskit-cache.outputs.cache-hit != 'true' && steps.build-agentskit.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}

      - name: Prune old AgentsKit caches for this ref
        if: ${{ always() && steps.build-agentskit.outcome == 'success' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-agentskit- 'macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}' "$GITHUB_REF"

      - name: Generate the project
        run: xcodegen generate

      # The Linux agentsd folder is a build output and gitignored, and the app copies
      # it. Empty is what a Mac without scripts/build-linux-agentsd.sh has.
      - name: Make room for the Linux agentsd
        run: mkdir -p App/Resources/servers

      # One scheme after the other, and with plug-in validation skipped: without it
      # SwiftTerm's plug-in fails and says nothing. No signing on a runner. Agents Host
      # carries agentsd and agents-control; the window is the App Store build.
      - name: Build Agents Host and the window (macOS)
        id: build-mac
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          build() {
            xcodebuild build -project Agents.xcodeproj -scheme AgentsHost \
              -destination 'platform=macOS' -derivedDataPath build/DD \
              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO &&
            xcodebuild build -project Agents.xcodeproj -scheme AgentsStore \
              -destination 'platform=macOS' -derivedDataPath build/DD \
              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
          }
          clean_retry "$RESTORED" build/DD -- build

      - name: Build Remote (iOS Simulator)
        id: build-remote
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" build/DD -- \
            xcodebuild build -project Agents.xcodeproj -scheme Remote \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      # Only when both app builds actually ran. They are skipped whenever an earlier
      # step fails, and a skipped step used to read as "not successful", so a job that
      # died long before them saved whatever DerivedData it happened to be holding.
      - name: Save Xcode build cache
        if: ${{ always() && steps.xcode-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}

      - name: Prune old Xcode caches for this ref
        if: ${{ always() && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' && steps.xcode-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-derived- 'macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}' "$GITHUB_REF"

      # ServerLinkTests runs this agentsd, and builds it itself when it is missing:
      # a whole Swift build inside the test run, holding a test thread for minutes,
      # which on a shared runner stalls everything else. Built here instead, and only
      # when the run includes a suite that reads it: a filtered run that names none of
      # them spent three to five minutes here on a binary nothing ran. The selector says
      # which suites those are. Skipping it also skips the SwiftPM cache save below,
      # which already waits on this build, so no partial cache is kept.
      - name: Build agentsd for the tests
        id: build-agentsd
        if: steps.test-selection.outputs.agentsd == 'build'
        env:
          RESTORED: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Daemon/.build -- \
            swift build --package-path Daemon --product agentsd

      # How long the runner's login shell takes to say its PATH. The app reads it
      # once per process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null

      # Build CodeText tests before execution so the cache can be saved before tests.
      - name: Build CodeText tests
        id: build-codetext
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          RESTORED: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/CodeText/.build -- \
            swift build --build-tests --package-path Packages/CodeText

      - name: Save SwiftPM build cache
        # This combined cache contains both paths below. Save it only when both
        # package builds ran, so a skipped package cannot produce a partial cache,
        # and never on a failure, for the reason above.
        if: ${{ always() && steps.test-selection.outputs.agentskit != 'skip' && steps.test-selection.outputs.codetext != 'skip' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.build-agentsd.outcome == 'success' && steps.build-codetext.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}

      - name: Prune old SwiftPM caches for this ref
        if: ${{ always() && steps.build-agentsd.outcome == 'success' && steps.build-codetext.outcome == 'success' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-swiftpm- 'macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}' "$GITHUB_REF"

      - name: Test CodeText
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.codetext_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.codetext }}
        run: |
          if [ "$TEST_MODE" = filter ]; then
            swift test --skip-build --package-path Packages/CodeText --filter "$TEST_FILTER"
          else
            swift test --skip-build --package-path Packages/CodeText
          fi

      - name: Test AgentsKit
        if: steps.test-selection.outputs.agentskit != 'skip'
        # A filtered run is a few seconds and a full one is over ten minutes, so this is
        # the full run's budget rather than the filtered one's.
        timeout-minutes: 25
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.agentskit_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.agentskit }}
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          run_agentskit_tests() {
            if [ "$TEST_MODE" = filter ]; then
              swift test --skip-build --package-path Packages/AgentsKit --filter "$TEST_FILTER"
            else
              swift test --skip-build --package-path Packages/AgentsKit
            fi
          }

          log="$RUNNER_TEMP/agentskit-tests.log"
          if run_agentskit_tests 2>&1 | tee "$log"; then
            exit 0
          else
            status=${PIPESTATUS[0]}
          fi
          if [ -z "$RESTORED" ]; then exit "$status"; fi

          if grep -Eq 'Undefined symbols for architecture|symbol\(s\) not found for architecture|AgentsKitCore.*undefined' "$log"; then
            echo "::warning::Stale AgentsKit link detected on a restored cache. Rebuilding and rerunning immediately from clean."
          else
            echo "::warning::AgentsKit tests failed on a restored build cache. Rebuilding and rerunning once from clean."
          fi
          rm -rf Packages/AgentsKit/.build
          swift build --build-tests --package-path Packages/AgentsKit
          run_agentskit_tests

  # The web remote's generator and the control plane (071, research R6), in a job of their
  # own so they never press on the test job's time cap. WebTypes holds the checked-in
  # Web/src/protocol/generated.ts to the Swift source: a protocol type changed without
  # regenerating fails here. ControlPlane links AgentsKit, so it runs on changes to either.
  packages:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      - name: Generated types are fresh
        if: steps.test-selection.outputs.webtypes != 'skip'
        run: swift test --package-path Packages/WebTypes

      - name: Test ControlPlane
        if: steps.test-selection.outputs.controlplane != 'skip'
        timeout-minutes: 20
        run: swift test --package-path Packages/ControlPlane

  # The web remote's checked-in build (071, D7, research R8): built with the pinned Node, it
  # must be byte for byte what is committed, so building Agents from source never needs Node.
  # Also tsc, the lint that keeps agent output inert, the licence list and the web tests.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Web/dist and generated.ts are what this source builds
        run: git diff --exit-code -- dist src/protocol/generated.ts

  # Tests that index or force-unwrap after an #expect (#94): a failed check carries on, and
  # the trap after it ends the whole `swift test` run, so every later test goes unreported.
  # A text check, so it runs on every change and needs no Mac.
  test-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-test-indexing.py --selftest
      - run: python3 scripts/check-test-indexing.py
