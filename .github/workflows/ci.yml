# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          # The selector compares against the PR base or the previous push.
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      # Restore Xcode and SwiftPM products from separate caches. The Xcode cache
      # can be saved as soon as both app builds finish.
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}

      - name: Restore AgentsKit build cache
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain.
      # Rewrite that mount in a restored graph when the component version matches.
      - name: Normalize AgentsKit build cache
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build

      - name: Build AgentsKit tests
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: swift build --build-tests --package-path Packages/AgentsKit

      - name: Save AgentsKit build cache
        if: ${{ steps.test-selection.outputs.agentskit != 'skip' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}

      - name: Generate the project
        run: xcodegen generate

      # The Linux agentsd folder is a build output and gitignored, and the app copies
      # it. Empty is what a Mac without scripts/build-linux-agentsd.sh has.
      - name: Make room for the Linux agentsd
        run: mkdir -p App/Resources/servers

      # One scheme after the other, and with plug-in validation skipped: without it
      # SwiftTerm's plug-in fails and says nothing. No signing on a runner.
      - name: Build Agents (macOS)
        run: >
          xcodebuild build -project Agents.xcodeproj -scheme Agents
          -destination 'platform=macOS' -derivedDataPath build/DD
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      - name: Build Remote (iOS Simulator)
        run: >
          xcodebuild build -project Agents.xcodeproj -scheme Remote
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      - name: Save Xcode build cache
        if: ${{ steps.xcode-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}

      # ServerLinkTests runs this agentsd, and builds it itself when it is missing:
      # a whole Swift build inside the test run, holding a test thread for minutes,
      # which on a shared runner stalls everything else. Built here instead.
      - name: Build agentsd for the tests
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: swift build --package-path Daemon --product agentsd

      # How long the runner's login shell takes to say its PATH. The app reads it
      # once per process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null

      # Build CodeText tests before execution so the cache can be saved before tests.
      - name: Build CodeText tests
        if: steps.test-selection.outputs.codetext != 'skip'
        run: swift build --build-tests --package-path Packages/CodeText

      - name: Save SwiftPM build cache
        # This combined cache contains both paths below. Save it only when both
        # package builds ran, so a skipped package cannot produce a partial cache.
        if: ${{ steps.test-selection.outputs.agentskit != 'skip' && steps.test-selection.outputs.codetext != 'skip' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            Daemon/.build
            Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ hashFiles('project.yml', 'Daemon/Package.swift', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}

      - name: Test CodeText
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.codetext_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.codetext }}
        run: |
          if [ "$TEST_MODE" = filter ]; then
            swift test --skip-build --package-path Packages/CodeText --filter "$TEST_FILTER"
          else
            swift test --skip-build --package-path Packages/CodeText
          fi

      - name: Test AgentsKit
        if: steps.test-selection.outputs.agentskit != 'skip'
        timeout-minutes: 10
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.agentskit_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.agentskit }}
        run: |
          if [ "$TEST_MODE" = filter ]; then
            swift test --skip-build --package-path Packages/AgentsKit --filter "$TEST_FILTER"
          else
            swift test --skip-build --package-path Packages/AgentsKit
          fi
