name: slow-tests

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Run only the Swift coverage jobs, as the nightly run does (#3442).
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  slow-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.coverage
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      AGENTS_RUN_SLOW: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Run slow AgentsKit tests
        run: |
          filter=$(scripts/slow-tests.sh Packages/AgentsKit)
          swift test --package-path Packages/AgentsKit --filter "$filter"
      - name: Run quarantined flaky tests
        continue-on-error: true
        env:
          AGENTS_RUN_FLAKY: "1"
        run: |
          status=0
          for package in Packages/CodeText Packages/AgentsKit; do
            filter=$(scripts/flaky-tests.sh "$package")
            [ -n "$filter" ] || continue
            swift test --package-path "$package" --filter "$filter" || status=1
          done
          exit $status

  # The wall-clock budgets (#225): held only here and by scripts/perf-tests.sh on a quiet
  # Mac. Everywhere else these tests check what they compute and print the time.
  perf-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.coverage
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Run the performance budgets
        run: scripts/perf-tests.sh

  # Swift coverage took longer than the PR job's test budget. Run it at night so it
  # cannot hold a pull request or a main push; this workflow is not a required check.
  # Each package has its own budget: AgentsKit's whole job takes about 6 minutes, and
  # CodeText's ran to the 60-minute limit on every night from 2026-10-28 to 11-03, on
  # an xcode-27 runner that the day's pull requests wait for (#594). 20 minutes is
  # more than three times AgentsKit's job; a CodeText run that needs more is hung.
  #
  # CodeText's tests pass in a second; what hung was the JSON export that `swift test`
  # makes after them (#3442). It read the coverage map of the 20 vendored tree-sitter
  # grammars, megabytes of generated C each, and on the runner's 7 GB filled 36 GB of
  # swap. That C is not ours to cover, so CodeText builds its C with no coverage map:
  # its Swift is still measured, and the whole test step takes seconds.
  coverage-swift:
    if: github.event_name == 'schedule' || inputs.coverage
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AgentsKit
            minutes: 60
            test-minutes: 55
            build-flags: ""
          - package: CodeText
            minutes: 20
            test-minutes: 15
            build-flags: -Xcc -fno-coverage-mapping
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.minutes }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          if [[ "${{ matrix.package }}" == AgentsKit ]]; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # The build and the test run are two steps, so a log says which one stops (#3442).
      - name: Build with coverage
        timeout-minutes: ${{ matrix.test-minutes }}
        run: |
          swift build --build-tests --enable-code-coverage ${{ matrix.build-flags }} \
            --package-path Packages/${{ matrix.package }}

      - name: Test with coverage
        # Leaves 5 minutes of the job for the coverage report and its upload.
        timeout-minutes: ${{ matrix.test-minutes }}
        run: |
          if [[ "${{ matrix.package }}" == AgentsKit ]]; then
            swift test --skip-build --enable-code-coverage --package-path Packages/AgentsKit \
              --experimental-maximum-parallelization-width 3
          else
            swift test --skip-build --enable-code-coverage --package-path Packages/CodeText
          fi

      - name: Report Swift coverage
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          package_path="Packages/${{ matrix.package }}"
          profile=""
          binary=""
          if [[ -d "$package_path/.build" ]]; then
            profile=$(find "$package_path/.build" -path '*/codecov/default.profdata' -type f -print -quit)
            # -ipath: this toolchain builds into .build/out/Products/Debug, not .build/<triple>/debug.
            binary=$(find "$package_path/.build" -ipath "*/debug/${{ matrix.package }}*Tests.xctest/Contents/MacOS/*Tests" -type f -print -quit)
          fi
          if [[ -f "$profile" && -n "$binary" ]]; then
            echo '### ${{ matrix.package }} coverage' >> "$GITHUB_STEP_SUMMARY"
            xcrun llvm-cov report -instr-profile="$profile" "$binary" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage profile not available; the test may have timed out.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Swift coverage profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: swift-coverage-${{ matrix.package }}
          path: Packages/${{ matrix.package }}/.build/**/codecov/*
          if-no-files-found: ignore
          retention-days: 14
