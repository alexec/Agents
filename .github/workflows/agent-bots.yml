# Runs the agent bot check (#3859) on this repository's pull requests. Another repository
# calls `alexec/Agents/.github/workflows/agent-bot-check.yml@v1` in the same way.
name: agent-bots

on:
  # labeled and unlabeled: a bot's PR with an approval label waits for a person (#3860).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-bots:
    uses: ./.github/workflows/agent-bot-check.yml
