# The agent bot check (#3859, spec 3856 question 5): a pull request that an agent's bot
# opened fails when the bot's owner lost write access to the repository, or when the
# owner is its only approver. A repository calls it from a short workflow of its own:
#
#   # .github/workflows/agent-bots.yml
#   on:
#     pull_request:
#     pull_request_review:
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     agent-bots:
#       uses: alexec/Agents/.github/workflows/agent-bot-check.yml@v1
#
# It reads `.github/agent-bots.yml` from the base branch through the API, never from the
# pull request's head, so a pull request cannot change its own rules:
#
#   bots:
#     alexec-agents[bot]: alexec
#   # A repository of one person: the owner's approval is enough.
#   require-another-approver: false
#
# It uses only the run's own GITHUB_TOKEN. The script is in this file, so a caller pins
# one ref and needs no checkout; scripts/agent-bot-check-selftest.py tests it.
name: agent bot check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the bot's owner and approvers
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          CONFIG = ".github/agent-bots.yml"
          WRITE = {"admin", "write"}


          def parse_config(text):
              """The small part of YAML that agent-bots.yml uses: `bots:`, a map of bot to
              owner, and `require-another-approver: true|false`."""
              bots, require, section = {}, True, None
              for raw in text.splitlines():
                  line = raw.split(" #", 1)[0].rstrip() if not raw.lstrip().startswith("#") else ""
                  if not line.strip():
                      continue
                  key, _, value = line.strip().partition(":")
                  key, value = key.strip().strip("'\""), value.strip().strip("'\"")
                  if line[0] not in " \t":
                      section = key
                      if key == "require-another-approver":
                          if value.lower() not in ("true", "false"):
                              raise ValueError(f"{CONFIG}: require-another-approver is {value!r}, not true or false")
                          require = value.lower() == "true"
                      elif key != "bots":
                          raise ValueError(f"{CONFIG}: unknown key {key!r}")
                  elif section == "bots" and key and value:
                      bots[key] = value
                  else:
                      raise ValueError(f"{CONFIG}: cannot read the line {raw.strip()!r}")
              return bots, require


          def approvers(reviews):
              """The people whose latest review approves. A bot's review never counts, and
              a comment does not change an earlier approval."""
              latest = {}
              for review in reviews:
                  user = review.get("user") or {}
                  login = user.get("login") or ""
                  if user.get("type") == "Bot" or login.endswith("[bot]"):
                      continue
                  state = review.get("state")
                  if state in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                      latest[login] = state
              return sorted(login for login, state in latest.items() if state == "APPROVED")


          def check(api, repo, number, author, base):
              """Returns (passed, message). `api(path)` returns the decoded JSON, or None
              for a 404."""
              content = api(f"repos/{repo}/contents/{CONFIG}?ref={urllib.parse.quote(base, safe='')}")
              if content is None:
                  return True, f"No {CONFIG} on {base}: no agent bots to check."
              bots, require = parse_config(base64.b64decode(content["content"]).decode())
              owner = bots.get(author)
              if owner is None:
                  return True, f"{author} is not an agent bot in {CONFIG}."
              access = api(f"repos/{repo}/collaborators/{urllib.parse.quote(owner)}/permission")
              permission = (access or {}).get("permission", "none")
              if permission not in WRITE:
                  return False, (
                      f"{author} acts for {owner}, who no longer has write access to {repo} "
                      f"(access: {permission}). An owner of {repo.split('/')[0]} must remove "
                      f"the install of {author.removesuffix('[bot]')}: Settings, GitHub Apps, "
                      f"Configure, Uninstall. Then remove {author} from {CONFIG}."
                  )
              if not require:
                  return True, f"{owner} has {permission} access; {CONFIG} lets the owner approve alone."
              people = approvers(api(f"repos/{repo}/pulls/{number}/reviews?per_page=100", pages=True))
              if people and set(people) == {owner}:
                  return False, (
                      f"{owner} is the only approver of a pull request that their bot {author} "
                      f"opened. Another person must approve it. A repository of one person can "
                      f"set `require-another-approver: false` in {CONFIG}."
                  )
              return True, f"{owner} has {permission} access; approvers: {', '.join(people) or 'none yet'}."


          def github_api(path, pages=False):
              url = f"{os.environ.get('GITHUB_API_URL', 'https://api.github.com')}/{path}"
              items = []
              while url:
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = json.load(response)
                          links = response.headers.get("Link") or ""
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return None
                      raise
                  if not pages:
                      return body
                  items += body
                  url = next((part.split(";")[0].strip(" <>") for part in links.split(",")
                              if 'rel="next"' in part), None)
              return items


          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as file:
                  event = json.load(file)
              pull = event["pull_request"]
              passed, message = check(github_api, event["repository"]["full_name"], pull["number"],
                                      pull["user"]["login"], pull["base"]["ref"])
              print(message if passed else f"::error title=Agent bot check::{message}")
              return 0 if passed else 1


          if __name__ == "__main__":
              sys.exit(main())
          PY
