# Rebuilds the web remote's checked-in files on main after a merge, and commits them (#473).
#
# Web/dist and Web/src/protocol/generated.ts stay checked in, so building Agents from source
# needs no Node (071, research R8). But a pull request no longer carries them: when every PR
# did, each merge left every other open PR in conflict over files nobody writes by hand.
# This regenerates both from what main now holds (`scripts/web.sh types`, then `build`) and
# commits them when they changed.
#
# It cannot loop:
# - its own commit is skipped by the `if:` below, whoever pushed it;
# - the build is deterministic, so a run on a fresh tree finds nothing to commit and stops;
# - a push with the default GITHUB_TOKEN starts no workflows at all.
#
# Branch protection: main requires the test, packages and check statuses, which a bot's
# commit never has, so GITHUB_TOKEN's push is refused. A push needs the WEB_DIST_TOKEN
# secret: a fine-grained token, contents read and write on this repository, of an account
# that may bypass the protection (an admin; enforce_admins is off). Without it this job fails
# and says so; nothing about the protection is loosened here.
name: web-dist

on:
  push:
    branches: [main]
    paths:
      - Web/**
      - Packages/WebTypes/**
      - Packages/AgentsKit/Sources/AgentsKitCore/**
      - scripts/web.sh
      - .github/workflows/web-dist.yml
  workflow_dispatch:

permissions:
  contents: write

# One at a time, never cancelled half way through a push. A queued run starts from main's
# tip, so the last one rebuilds from the last merge.
concurrency:
  group: web-dist
  cancel-in-progress: false

jobs:
  rebuild:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'web: rebuild Web/dist') }}"
    # The generator reads AgentsKitCore with swift-syntax and is built for macOS 27.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WEB_DIST_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version

      - name: Restore the generator's build
        uses: actions/cache@v5
        with:
          path: Packages/WebTypes/.build
          key: web-dist-webtypes-${{ hashFiles('Packages/WebTypes/Package.swift', 'Packages/WebTypes/Package.resolved', 'Packages/WebTypes/Sources/**') }}
          restore-keys: web-dist-webtypes-

      - name: Rebuild and commit
        env:
          HAS_TOKEN: ${{ secrets.WEB_DIST_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Main can move while this builds: start again from its new tip, a few times.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            scripts/web.sh types
            scripts/web.sh build
            git add -A -- Web/dist Web/src/protocol/generated.ts
            if git diff --cached --quiet; then
              echo "Web/dist and generated.ts are already what main's source builds."
              exit 0
            fi
            tip=$(git rev-parse --short HEAD)
            git commit -q -m "web: rebuild Web/dist and generated.ts for $tip" \
              -m "Made by .github/workflows/web-dist.yml after the merge (#473)."
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::push $attempt to main was refused; trying again from its tip"
            sleep 10
          done
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::main's branch protection refuses GITHUB_TOKEN's push. Add a WEB_DIST_TOKEN secret (see the head of web-dist.yml), or run scripts/web.sh types and build on main and push the result."
          else
            echo "::error::could not push the rebuilt Web/dist to main"
          fi
          exit 1
