# The docs site's check (044): on every push and pull request, the same check as
# `scripts/docs.sh check`, and proof that the check still catches each kind of break.
name: docs-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: scripts/docs.sh check
      - run: scripts/docs-check-selftest.sh
