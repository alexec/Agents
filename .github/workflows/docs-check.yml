# The docs site's check (044): the same check as `scripts/docs.sh check`, and proof that
# the check still catches each kind of break. Runs only when the docs or their check
# change. `check` is a required status on main, so on a pull request the job always runs
# and passes at once when nothing it reads has changed; a `paths:` filter there would
# leave the pull request waiting on a check that never reports.
name: docs-check

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs.sh"
      - "scripts/docs-check.py"
      - "scripts/docs-check-selftest.sh"
      - ".github/workflows/docs-check.yml"
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Did the docs change?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo changed=true >> "$GITHUB_OUTPUT"
          elif gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --name-only \
            | grep -qE '^(docs/|mkdocs\.yml$|scripts/docs\.sh$|scripts/docs-check\.py$|scripts/docs-check-selftest\.sh$|\.github/workflows/docs-check\.yml$)'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo "No docs change; nothing to check."
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs.outputs.changed == 'true'
        uses: actions/checkout@v4
      - if: steps.docs.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.docs.outputs.changed == 'true'
        run: scripts/docs.sh check
      - if: steps.docs.outputs.changed == 'true'
        run: scripts/docs-check-selftest.sh
