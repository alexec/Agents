<text x="40" y="38" font-size="20" font-weight="700">Agents · Containers (C4 level 2)</text><text x="40" y="60" font-size="13" fill="#555">The deployable parts of Agents and how they talk. A host is a Mac with Agents Host, or a Linux server running agentsd.</text>
