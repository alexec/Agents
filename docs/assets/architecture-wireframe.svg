<text class="s"  x="315" y="305" text-anchor="middle">part of the Agent Loops app</text>

<!-- Phone -->
<rect x="560" y="56" width="104" height="206" rx="18" class="box"/>
<rect x="592" y="64" width="40" height="8" rx="4" class="bar"/>
<rect x="572" y="86"  width="80" height="10" rx="5" class="bar"/>
<rect x="572" y="106" width="64" height="10" rx="5" class="bar2"/>
<rect x="572" y="126" width="72" height="10" rx="5" class="bar2"/>
<rect x="572" y="146" width="56" height="10" rx="5" class="bar2"/>
<rect x="572" y="176" width="80" height="34" rx="6" class="ghost"/>
<rect x="572" y="226" width="80" height="16" rx="8" class="box"/>
<text class="h2" x="612" y="288" text-anchor="middle">Remote</text>
<text class="s"  x="612" y="305" text-anchor="middle">iPhone and iPad</text>

<!-- Browser -->
<rect x="700" y="56" width="330" height="206" rx="10" class="box"/>
<rect x="700" y="56" width="330" height="28" rx="10" class="soft"/>
<circle cx="716" cy="70" r="4" class="bar"/><circle cx="730" cy="70" r="4" class="bar"/><circle cx="744" cy="70" r="4" class="bar"/>
<rect x="762" y="62" width="200" height="16" rx="8" class="box"/>
<text class="s" x="774" y="74">localhost:8792</text>
<rect x="712" y="96" width="90" height="154" rx="4" class="soft"/>
<text class="s" x="720" y="114">Sessions</text>
<text class="h2" x="720" y="136">Work</text>
<text class="h2" x="720" y="156">Docs</text>
<rect x="720" y="170" width="60" height="9" rx="4" class="bar2"/>
<rect x="814" y="106" width="140" height="12" rx="6" class="bar2"/>
<rect x="850" y="128" width="168" height="12" rx="6" class="bar"/>
<rect x="814" y="150" width="170" height="12" rx="6" class="bar2"/>
<rect x="814" y="226" width="204" height="18" rx="9" class="box"/>
<text class="h2" x="865" y="288" text-anchor="middle">Web page</text>
<text class="s"  x="865" y="305" text-anchor="middle">any browser</text>

<!-- Coming soon: Windows and Android -->
<rect x="1056" y="64" width="120" height="80" rx="8" class="ghost"/>
<rect x="1102" y="88" width="13" height="13" class="bar"/><rect x="1117" y="88" width="13" height="13" class="bar"/>
