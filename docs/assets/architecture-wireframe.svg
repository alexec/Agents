<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-label="Wireframe of the Agents architecture">
<defs>
<style>
  :root { --ink:#2b2b2b; --soft:#8a8a8a; --line:#d9d9d9; --fill:#f5f5f3; --note:#2f6fdb; }
  
  
  
  
  svg { width:100%; height:auto; display:block; background:#fff; border:1px solid var(--line); border-radius:14px; }
  svg text { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; fill:var(--ink); }
  .box   { fill:#fff;        stroke:var(--ink); stroke-width:1.6; }
  .soft  { fill:var(--fill); stroke:var(--ink); stroke-width:1.2; }
  .ghost { fill:none; stroke:var(--soft); stroke-width:1.2; stroke-dasharray:6 5; }
  .bar   { fill:var(--line); }
  .bar2  { fill:#ececec; }
  .h     { font-size:17px; font-weight:700; }
  .h2    { font-size:14px; font-weight:700; }
  .t     { font-size:13px; }
  .s     { font-size:11.5px; fill:var(--soft); }
  .zone  { font-size:12px; font-weight:700; letter-spacing:.12em; fill:var(--soft); }
  .wire  { fill:none; stroke:var(--ink); stroke-width:1.5; marker-end:url(#arrow); }
  .wireD { fill:none; stroke:var(--soft); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrowS); }
  .pin   { fill:var(--note); }
  .pinT  { fill:#fff; font-size:12px; font-weight:700; text-anchor:middle; }
  .noteT { fill:var(--note); font-size:12px; }
  
  
  
  
  
</style>
  <marker id="arrow"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker>
  <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
</defs>

<!-- ============ ZONE 1: SCREENS ============ -->
<text class="zone" x="30" y="34">SCREENS · THEY SHOW, THEY RUN NOTHING</text>

<!-- person -->
<circle cx="70" cy="110" r="17" class="box"/>
<path d="M40,175 Q70,130 100,175 Z" class="box"/>
