<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<style>
.t{fill:#fff;font-weight:700;font-size:15px;text-anchor:middle} .k{fill:#fff;font-size:11px;text-anchor:middle;opacity:.9} .d{fill:#fff;font-size:11.5px;text-anchor:middle}
.r{stroke:#555;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#a)} .rl{font-size:11.5px;fill:#333;text-anchor:middle} .rt{font-size:10.5px;fill:#666;text-anchor:middle}
