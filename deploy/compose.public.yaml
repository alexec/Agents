# The control plane on a machine of its own, at a real domain with a publicly trusted
# certificate (#61): one copy over a folder on this machine, and Caddy in front, getting the
# certificate from Let's Encrypt. Codes carry no pin. The web page is served at the domain
# too (#1459), for a browser anywhere, and its MCP Apps views at a second name (#1484). The how-to is
# docs/how-to/run-the-control-plane-in-the-cloud.md.
#
#   scripts/build-linux-agentsd.sh               # the Linux host, handed to servers that join
#   deploy/make-secrets.sh --public --kms projects/P/locations/L/keyRings/R/cryptoKeys/K \
#       [--service-account sa.json] [--apns AuthKey_KEYID.p8]
#   AGENTS_DOMAIN=agents.example.com AGENTS_VIEWS_DOMAIN=views.example.com \
#       ACME_EMAIL=you@example.com docker compose -f deploy/compose.public.yaml up -d --build
#
# AGENTS_DOMAIN and AGENTS_VIEWS_DOMAIN must already point at this machine, with ports 80 and
# 443 open to the internet. The variables may also go in deploy/.env.
#
# The control key is sealed in the store by Google Cloud KMS (#1458), so it is never on this
# machine's disk in clear. make-secrets.sh puts the key's name in deploy/.env as
# AGENTS_CONTROL_KMS, and the service account file in deploy/secrets/gcp-service-account
# (empty when there is none: then the machine's own service account is used).
#
# The APNs key (#1460) is a secret here too, deploy/secrets/apns-key, never in the store or a
# code: with it, the control plane pushes to a device itself when no Mac host relays its
# notices. Empty (make-secrets.sh without --apns), it sends no pushes and says so in its log.
name: agents-control

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Containerfile
      # The version Settings ▸ Control plane shows (#1498): git describe, as deploy/gcp/up.sh
      # gives it. Unset, it is "dev".
      args:
        VERSION: ${AGENTS_VERSION:-dev}
    image: agents-control:latest
    restart: unless-stopped
    environment:
      # A folder in the data volume, or the bucket Agents Host already uses (s3://bucket/prefix),
      # so a move copies nothing (058 R16 3). The bucket's keys go in deploy/.env.
      AGENTS_STORE: ${AGENTS_STORE:-file:///data/store}
      AGENTS_STORE_ENDPOINT: ${AGENTS_STORE_ENDPOINT:-}
      AGENTS_STORE_REGION: ${AGENTS_STORE_REGION:-}
      AGENTS_STORE_PATH_STYLE: ${AGENTS_STORE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AGENTS_CONTROL_URL: https://${AGENTS_DOMAIN:?set AGENTS_DOMAIN to the name that points at this machine}
      # The key that seals the control key: gcpkms://projects/P/locations/L/keyRings/R/cryptoKeys/K.
      AGENTS_CONTROL_KMS: ${AGENTS_CONTROL_KMS:?run deploy/make-secrets.sh --public --kms <key name>}
      # The right to use that key. An empty file: the machine's own service account.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account
      AGENTS_CONTROL_NAME: ${AGENTS_CONTROL_NAME:-${AGENTS_DOMAIN}}
      # The web page at https://AGENTS_DOMAIN/ (#1459), built into the image with the control
      # plane, so the two are one version. A browser pairs there by a code from Add a
      # Browser… on a paired Mac, iPhone or iPad. Empty serves no page.
      AGENTS_CONTROL_PUBLIC_WEB: ${AGENTS_CONTROL_PUBLIC_WEB-/web}
      # The second name, where the page's MCP Apps views are drawn (#1484): the sandbox proxy
      # must be at another origin than the page's. Only /sandbox.html and /sandbox.js are
      # served there.
      AGENTS_CONTROL_VIEWS_URL: https://${AGENTS_VIEWS_DOMAIN:?set AGENTS_VIEWS_DOMAIN to the second name that points at this machine, such as views.example.com}
      # 1 to start empty, for a handover from Agents Host to fill (058 research R16).
      AGENTS_CONTROL_RECEIVE: ${AGENTS_CONTROL_RECEIVE:-}
      # Caddy's address below: only its X-Forwarded-For says where a socket came from, for
      # the per-source budget (public-security.md P3).
      AGENTS_CONTROL_TRUSTED_PROXIES: 172.30.61.250
      # The APNs key's file, and its Key ID and Team ID from deploy/.env (#1460).
      AGENTS_APNS_KEY_FILE: /run/secrets/apns-key
      AGENTS_APNS_KEY_ID: ${AGENTS_APNS_KEY_ID:-}
      AGENTS_APNS_TEAM_ID: ${AGENTS_APNS_TEAM_ID:-}
    secrets: [gcp-service-account, apns-key]
    volumes:
      - data:/data
      # The Linux host, served at /v1/servers/… to servers joining with the install command.
      - ../App/Resources/servers:/servers:ro
      # The runtimes' toolsets, served at /v1/toolsets/…, so a server that joins installs
      # Claude by itself (#1312). Without them it gets no Claude (#1461's walk).
      - ../App/Resources/toolsets:/toolsets:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [control]
    ports: ["80:80", "443:443"]
    environment:
      AGENTS_DOMAIN: ${AGENTS_DOMAIN}
      AGENTS_VIEWS_DOMAIN: ${AGENTS_VIEWS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt's notices}
      # The hand-back page's name (agentloops.dev), read only by deploy/site/site.caddy (#1343).
      AGENTS_SITE_DOMAIN: ${AGENTS_SITE_DOMAIN:-}
    networks:
      default:
        # Fixed, so agents-control can trust it and nothing else on the network.
        ipv4_address: 172.30.61.250
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      # Our own sites, turned on by a file in deploy/site.d (deploy/gcp/site.sh); empty here
      # unless that was run. Their files are in deploy/site/www.
      - ./site.d:/etc/caddy/site.d:ro
      - ./site/www:/srv/site:ro
      # The certificate and the ACME account: kept, so a restart doesn't ask for a new one.
      - caddy:/data

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.61.0/24

secrets:
  gcp-service-account:
    file: ./secrets/gcp-service-account
  apns-key:
    file: ./secrets/apns-key

volumes:
  data:
  caddy:
