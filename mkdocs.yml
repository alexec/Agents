# The docs site (044). Built by Zensical, which reads this file; Material for MkDocs reads it too.
# Preview: scripts/docs.sh serve   Check: scripts/docs.sh check
site_name: Agents
site_description: Run coding agents on your Mac, and follow them from your iPhone and iPad.
site_url: https://docs.agentloops.dev/
repo_url: https://github.com/alexec/Agents
docs_dir: docs
# The footer on every page: the privacy and terms pages (#1856).
copyright: <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a>
strict: true

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light

plugins:
  - search
  # A page that moves leaves its old path here, pointing at the new one: old.md: new.md
  - redirects:
      redirect_maps:
        how-to/add-an-mcp-server-by-hand.md: how-to/add-a-connector-by-hand.md
        how-to/add-an-mcp-server-from-the-registry.md: how-to/add-a-connector-from-the-registry.md
        how-to/share-one-copy-of-a-local-mcp-server.md: how-to/share-one-copy-of-a-local-connector.md
        how-to/sign-in-to-an-mcp-server.md: how-to/sign-in-to-a-connector.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Mermaid fences drawn as diagrams (the compliance pack's data flow, #1001).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

